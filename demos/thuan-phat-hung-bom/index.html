<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Quy trình tính giá BOM & duyệt dự toán — Thuận Phát Hưng</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --q1:#1D4E89;--q1d:#0F2E52;--q1l:#E6EFF9;--q1x:#F3F7FC;
  --q2:#6B3FA0;--q2d:#3B2159;--q2l:#EFE7F7;--q2x:#F8F5FC;
  --bt:#475569;--btd:#1E293B;--btl:#E2E8F0;
  --nn:#7C3AED;--nnd:#4C1D95;--nnl:#EDE9FE;
  --teal:#0E7C66;--teall:#E1F5EF;
  --amber:#8A5A0B;--amberl:#FBEED9;
  --green:#3B6D11;--greenl:#EAF3DE;
  --red:#A32D2D;--redl:#FEE8E8;
  --g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g300:#D1D5DB;--g400:#9CA3AF;--g500:#6B7280;--g700:#374151;--g900:#111827;
  --r:8px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--g100);color:var(--g900);font-size:14px;line-height:1.45}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--q1);outline-offset:2px}

.hdr{padding:24px 36px;color:#fff}
.hdr .kicker{font-size:12px;opacity:.75;margin-bottom:6px}
.hdr h1{font-size:21px;font-weight:700;margin-bottom:4px}
.hdr p{font-size:13px;opacity:.8;max-width:820px}
.h-ov{background:linear-gradient(135deg,#14213D,#1D4E89)}
.h-q1{background:linear-gradient(135deg,var(--q1d),var(--q1))}
.h-q2{background:linear-gradient(135deg,var(--q2d),var(--q2))}
.h-bt{background:linear-gradient(135deg,var(--btd),var(--bt))}
.h-nn{background:linear-gradient(135deg,var(--nnd),var(--nn))}

.tabs{background:#fff;border-bottom:1px solid var(--g200);display:flex;overflow-x:auto;align-items:stretch}
.tab{padding:13px 18px;font-size:13px;font-weight:500;color:var(--g500);cursor:pointer;border:none;background:none;border-bottom:2.5px solid transparent;white-space:nowrap}
.tab:hover{color:var(--g700)}
.tab.on-ov{color:#14213D;border-bottom-color:#14213D;font-weight:600}
.tab.on-q1{color:var(--q1);border-bottom-color:var(--q1);font-weight:600}
.tab.on-q2{color:var(--q2);border-bottom-color:var(--q2);font-weight:600}
.tab.on-bt{color:var(--bt);border-bottom-color:var(--bt);font-weight:600}
.tab.on-nn{color:var(--nn);border-bottom-color:var(--nn);font-weight:600}
.tab-sep{display:flex;align-items:center;padding:0 10px 0 18px;margin-left:8px;border-left:1px solid var(--g200);font-size:11px;color:var(--g400);white-space:nowrap}

.legend{background:#14213D;color:#fff;padding:7px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:11px}
.legend .lbl{opacity:.65}
.lg{display:inline-flex;align-items:center;padding:2px 9px;border-radius:11px;font-weight:600}
.lg-fact{background:rgba(29,78,137,.45);color:#d6e5f8}
.lg-assume{background:rgba(138,90,11,.5);color:#fbe6c4}
.lg-fill{background:rgba(194,91,16,.45);color:#fde2cc}

.stepnav{background:#fff;border-bottom:1px solid var(--g200);position:sticky;top:env(safe-area-inset-top,0px);z-index:50;overflow-x:auto}
.sn{display:flex;align-items:center;padding:10px 24px;min-width:max-content}
.sn-i{display:flex;align-items:center;cursor:pointer;border:none;background:none;padding:2px}
.sn-d{width:28px;height:28px;border-radius:50%;border:2px solid var(--g300);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--g400);flex-shrink:0}
.sn-l{font-size:11px;color:var(--g500);font-weight:500;margin:0 4px 0 6px;white-space:nowrap}
.sn-line{width:18px;height:2px;background:var(--g200);flex-shrink:0}
.sn-i.done .sn-d{background:var(--greenl);border-color:var(--green);color:var(--green)}
.q1 .sn-i.on .sn-d{background:var(--q1);border-color:var(--q1);color:#fff}
.q2 .sn-i.on .sn-d{background:var(--q2);border-color:var(--q2);color:#fff}
.sn-i.on .sn-l{color:var(--g900);font-weight:600}

.main{max-width:1060px;margin:24px auto;padding:0 18px 60px}
.card{background:#fff;border:1px solid var(--g200);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(17,24,39,.06)}
.card-h{padding:16px 22px;border-bottom:1px solid var(--g200);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-h>div:nth-child(2){flex:1;min-width:200px}
.card-h.q1{background:var(--q1x)}.card-h.q2{background:var(--q2x)}.card-h.bt{background:#F1F5F9}.card-h.nn{background:#F5F3FF}
.badge{min-width:34px;height:34px;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;padding:0 6px}
.b-q1{background:var(--q1)}.b-q2{background:var(--q2)}.b-bt{background:var(--bt)}.b-nn{background:var(--nn)}
.card-t{font-size:15px;font-weight:600;margin-bottom:2px}
.card-d{font-size:12px;color:var(--g500)}
.status{margin-left:auto;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:12px;white-space:nowrap}
.st-wait{background:var(--amberl);color:var(--amber)}
.st-ok{background:var(--greenl);color:var(--green)}
.st-run{background:var(--q1l);color:var(--q1)}

.ibar{display:grid;grid-template-columns:1.1fr 1.3fr 1.3fr 1.6fr;border-bottom:1px solid var(--g200)}
.ib{padding:9px 16px;border-right:1px solid var(--g200)}
.ib:last-child{border-right:none}
.ib-l{font-size:10.5px;font-weight:600;color:var(--g400);margin-bottom:2px}
.ib-v{font-size:12px;color:var(--g700);font-weight:500}
.eye{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:600}
.eye-sale{background:#FDE8D8;color:#7A3208}
.eye-int{background:var(--g100);color:var(--g700);border:1px solid var(--g300)}

.body{padding:20px 22px}
.sec{margin-bottom:22px}
.sec:last-child{margin-bottom:0}
.sec-t{font-size:13px;font-weight:700;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--g200);color:var(--g700);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q1c .sec-t{border-color:var(--q1l);color:var(--q1d)}
.q2c .sec-t{border-color:var(--q2l);color:var(--q2d)}
.btc .sec-t{border-color:var(--btl);color:var(--btd)}
.nnc .sec-t{border-color:var(--nnl);color:var(--nnd)}
.sec-t .sub{font-weight:400;font-size:11.5px;color:var(--g500)}
details.sec>summary{list-style:none;cursor:pointer}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .sec-t::before{content:'▸';font-size:11px;transition:transform .15s}
details.sec[open]>summary .sec-t::before{transform:rotate(90deg)}

.fg{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.fg3{grid-template-columns:repeat(3,1fr)}
.fg4{grid-template-columns:repeat(4,1fr)}
.fg5{grid-template-columns:repeat(5,1fr)}
.fgrp.full{grid-column:1/-1}
.fgrp label{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;font-weight:600;color:var(--g500);margin-bottom:4px}
.fgrp input,.fgrp textarea,.fgrp select{width:100%;padding:7px 10px;border:1px solid var(--g300);border-radius:var(--r);font-family:inherit;font-size:13px;color:var(--g900);background:#fff;resize:vertical}
.fgrp input:focus,.fgrp textarea:focus,.fgrp select:focus{outline:none;border-color:var(--q1);box-shadow:0 0 0 3px rgba(29,78,137,.12)}
.fgrp textarea{min-height:54px}
.fgrp input[readonly]{background:var(--g100);color:var(--g700);font-weight:600}
.fhint{font-size:11px;color:var(--g400);margin-top:3px;font-weight:400}
.tg{display:inline-block;border-radius:9px;padding:0 7px;font-size:10px;font-weight:700}
.t-fill{background:#FDE8D8;color:#7A3208;border:1px solid #E3B892}
.t-auto{background:var(--g200);color:var(--g500);border:1px solid var(--g300)}
.t-fact{background:var(--q1l);color:var(--q1);border:1px solid #9DBBE0}
.t-assume{background:var(--amberl);color:var(--amber);border:1px solid #D9B77A}

.tw{overflow-x:auto;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--g100);padding:7px 9px;text-align:left;font-size:11px;font-weight:600;color:var(--g500);border:1px solid var(--g200);white-space:nowrap}
td{padding:6px 9px;border:1px solid var(--g200);vertical-align:middle}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td input,td select{width:100%;border:1px solid var(--g300);border-radius:6px;font-family:inherit;font-size:12.5px;padding:4px 6px;background:#fff;min-width:80px}
td input[type=number]{text-align:right}
tr.grp td{background:var(--g50);font-weight:600}
tr.tot td{background:var(--g100);font-weight:700}
td.pick{background:#F0F6FD}
.miss{color:var(--red);font-weight:600}
.chip{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:8px;display:inline-block;white-space:nowrap}
.c-ok{background:var(--teall);color:var(--teal)}
.c-wait{background:var(--amberl);color:var(--amber)}
.c-fact{background:var(--q1l);color:var(--q1)}
.c-tp{background:var(--amberl);color:var(--amber)}
.c-sa{background:var(--teall);color:var(--teal)}
.c-no{background:var(--g100);color:var(--g400)}

.co{border-radius:8px;padding:11px 14px;font-size:12.5px;line-height:1.55;margin-bottom:14px}
.co-warn{background:var(--amberl);border:1px solid #D9B77A;color:#5c3706}
.co-info{background:var(--q1l);border:1px solid #9DBBE0;color:var(--q1d)}
.co-ok{background:var(--teall);border:1px solid #8FCDBC;color:#0A4D3F}
.co-danger{background:var(--redl);border:1px solid #E3A0A0;color:#6d1d1d}
.co-nn{background:#F5F3FF;border:2px dashed var(--nn);color:var(--nnd)}
.co b.t{display:block;margin-bottom:2px}
.co .btn{margin-top:8px}

.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.m{border-radius:8px;padding:11px;border:1px solid var(--g200);background:var(--g50)}
.m-v{font-size:17px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.m-l{font-size:11px;color:var(--g500);margin-top:3px}
.m-blue .m-v{color:var(--q1)}.m-green .m-v{color:var(--green)}.m-amber .m-v{color:var(--amber)}

.line{border:1px solid var(--g200);border-left:4px solid var(--q1);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:#fff}
.line-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.line-h b{font-size:13px}
.line-h .x{margin-left:auto}
.pk-note{font-size:11.5px;color:var(--g500);margin:10px 0 6px}
.addbar{display:flex;gap:8px;flex-wrap:wrap}

.navr{display:flex;justify-content:space-between;align-items:center;padding:13px 22px;border-top:1px solid var(--g200);background:var(--g50);gap:10px;flex-wrap:wrap}
.navc{font-size:12px;color:var(--g500)}
.navb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:7px 15px;border-radius:8px;border:1px solid var(--g300);background:#fff;color:var(--g700);font-size:13px;font-weight:500;cursor:pointer}
.btn:hover{background:var(--g100)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-q1{background:var(--q1);color:#fff;border-color:var(--q1)}.btn-q1:hover{background:var(--q1d)}
.btn-q2{background:var(--q2);color:#fff;border-color:var(--q2)}.btn-q2:hover{background:var(--q2d)}
.btn-back{color:var(--amber);border-color:#D9B77A;background:var(--amberl)}
.btn-x{color:var(--red);border-color:#E3A0A0;background:#fff}
.hint-r{font-size:12px;color:var(--amber)}

.flowcard{cursor:pointer;border:1px solid;border-left:4px solid;border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff;width:100%;text-align:left;display:block}
.flowcard .ft{font-size:14px;font-weight:600;margin-bottom:3px}
.flowcard .fd{font-size:12px;color:var(--g500);margin-bottom:8px}
.flowcard .fs{display:flex;gap:6px;flex-wrap:wrap}
.flowcard .fs span{font-size:11px;padding:2px 9px;border-radius:12px;border:1px solid var(--g300);color:var(--g500);background:#fff}
.flowcard .fs span.d{background:var(--greenl);border-color:var(--green);color:var(--green)}
.vis td{text-align:center}
.vis td:first-child{text-align:left}
.y{color:var(--green);font-weight:700}
.p{color:var(--amber);font-weight:600}
.no{color:var(--g400)}

@media print{.tabs,.stepnav,.navr,.legend{display:none!important}.main{margin:0;max-width:100%}.card{box-shadow:none}body{background:#fff}}
@media(max-width:760px){
  .status{margin-left:0}
  .fg,.fg3,.fg4,.fg5,.ibar,.mg{grid-template-columns:1fr 1fr}
  .ib{border-right:none;border-bottom:1px solid var(--g200)}
  .main{padding:0 10px 40px}.hdr{padding:18px}.sn-l{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="hdr"></div>
<div class="tabs" id="tabs"></div>
<div class="legend">
  <span class="lbl">Nguồn số liệu:</span>
  <span class="lg lg-fact">Theo nguồn (Excel / buổi trao đổi)</span>
  <span class="lg lg-assume">Giả định minh họa, cần DN xác nhận</span>
  <span class="lg lg-fill">Ô người dùng điền</span>
</div>
<div class="stepnav" id="stepnav"></div>
<div class="main" id="main"></div>

<script>
/* =====================================================================
   DỮ LIỆU NGUỒN
   ===================================================================== */
// Sheet "CP VC ĐƯỜNG BỘ" — chưa VAT, chưa gồm bốc xếp 2 đầu
const VC_KC=['01 - 10 km','11 - 20 km','21 - 30 km','31 - 40 km','41 - 50 km','51 - 60 km','61 - 70 km','71 - 80 km','81 - 100 km'];
const VC_XE=['≤ 2,4 tấn (4,2×1,7×1,7m)','3,5 tấn (5×1,8×1,8m)','5 tấn (6,2×2,1×2,1m)','8 tấn (7×2,2×2,2m)','10 tấn (7,4×2,2×2,2m)','15 tấn (9,2×2,35×2,4m)'];
const VC_TB={
  '01 - 10 km':[1440000,1800000,2160000,2880000,3105000,3967500],
  '11 - 20 km':[1560000,1980000,2340000,3240000,3450000,4140000],
  '21 - 30 km':[1800000,2160000,2520000,3420000,3622500,4312500],
  '31 - 40 km':[2040000,2340000,2700000,3600000,3795000,4485000],
  '41 - 50 km':[2280000,2520000,2880000,3780000,3967500,4830000],
  '51 - 60 km':[2640000,2700000,3060000,3960000,4140000,5175000],
  '61 - 70 km':[2880000,3060000,3420000,4140000,4312500,5520000],
  '71 - 80 km':[3120000,3240000,3600000,4320000,4485000,6037500],
  '81 - 100 km':[3720000,3840000,3960000,4500000,5002500,6382500]
};
function vcPrice(kc,xe){const r=VC_TB[kc]||VC_TB[VC_KC[0]];const i=VC_XE.indexOf(xe);return r[i>=0?i:2];}

// Vật tư: mã theo sheet BOM/TINH GIA; đơn giá chip/MK32 theo TINH GIA, còn lại giả định (mục 8.7)
const NVL_DEF=[
 ['chip','10GIGHVT0018','Giấy Chipboard','kg',10800,'fact'],
 ['mk32','10TPKEOZ0004','Keo MK32','kg',7000,'fact'],
 ['carton','','Giấy bán phẩm Carton','kg',9000,'assume'],
 ['testliner','','Giấy bán phẩm Testliner (lớp mặt)','kg',12000,'assume'],
 ['ktt','10NLKEOZ0002','Keo trung tính 2TP','kg',60000,'assume'],
 ['primal','10NLTHGI0022','Hóa chất Primal AC 261','kg',80000,'assume'],
 ['son','10NLTHGI0046','Sơn dầu màu vàng','kg',60000,'assume'],
 ['dt60','10NLTHGI0047','Đai thép niềng 60×0,65mm','kg',25000,'assume'],
 ['dt50','10NLTHGI0048','Đai thép niềng 50×0,65mm','kg',25000,'assume'],
 ['napday','10NLNTSZ0004','Nắp đậy thùng giấy','cái',20000,'assume'],
 ['quaixach','10NLQTSZ0004','Quai xách thùng giấy','bộ',8000,'assume'],
 ['daikep','10NLTHGI0021','Đai kẹp thùng giấy (D510)','cái',15000,'assume'],
 ['napgo','10NLTHGI0039','Nắp gỗ đáy thùng giấy 505mm','cái',15000,'assume']
];
const NVL={};NVL_DEF.forEach(r=>NVL[r[0]]={ma:r[1],ten:r[2],dvt:r[3],gia:r[4],ng:r[5]});

const TYPE_L={loi:'Lõi giấy',v:'Thanh V',thung:'Thùng giấy'};
const DVT={loi:'cái',v:'thanh',thung:'thùng'};
const VC_OPT=['Không — khách tự nhận','Đường bộ','Đường biển','Đường sắt'];
const VC_CACH=['Tra biểu phí đường bộ','Tùy chỉnh — nhập phí/chuyến'];
const BXX=['Không','Có — theo mức chuẩn','Có — tùy chỉnh phí/chuyến'];
const D1_OK='✓ Duyệt — chuyển cấp 2', D1_SALE='↩ Trả Sale điều chỉnh giá xin duyệt', D1_BACK='↩ Trả người tính giá rà soát lại';
const D2_OK='✓ Duyệt — trả giá cho Sale', D2_SALE='↩ Trả Sale điều chỉnh giá xin duyệt', D2_BACK='↩ Trả người tính giá rà soát lại';
const MA_YC='YCTG-2609-001', MA_DT='DT-2609-001';

/* =====================================================================
   STATE
   ===================================================================== */
const STORE='tph_bom_v15';
function mkDefault(){
  const nvl={};NVL_DEF.forEach(r=>nvl[r[0]]={gan:'',bq:'',tu:String(r[4])});
  const nhom={};['loi','v','thung'].forEach(k=>nhom[k]={sx:'10',ql:'25',m:'20'});
  return {
    nav:{view:'ov',q1:0,q2:0},done:{},hist:[],seq:{L:3,P:2},
    req:{khach:'Công ty TNHH Bao Bì Miền Đông',nguoiyc:'Ngô Thị Hạnh — Sale',ngay:'2026-09-20',diachi:'KCN Sóng Thần 2, Dĩ An, Bình Dương',
      vc:VC_OPT[1],vcCach:VC_CACH[0],khoangcach:VC_KC[0],loaixe:VC_XE[2],vcTuy:'',vcGhichu:'',sochuyen:'1',bxx:BXX[1],bxxTuy:'',ngayTC:'30',hoahong:'3',ghichu:'',
      lines:[
        {uid:'L1',type:'loi',d:'300',h:'810',t:'3',sl:'300'},
        {uid:'L2',type:'v',c1:'50',c2:'50',t:'4',l:'1200',sl:'500'},
        {uid:'L3',type:'thung',od:'550',oh:'600',id:'330',ih:'540',sl:'100',pk:[
          {uid:'P1',src:'dm',key:'thuocdo',ten:'',quycach:'',sl:'1'},
          {uid:'P2',src:'moi',key:'',ten:'Lò xo',quycach:'Lò xo gắn trong thùng, theo mẫu khách',sl:'1'}]}
      ]},
    kt:{nguoi:'Trần Văn Kiểm — Người tính giá',tra:false,ykien:'',
      bom:{L1:{src:'calc',chip:'1.95',mk32:'0.2835'},L2:{src:'calc',carton:'',testliner:'',mk32:''},L3:{src:'calc'}}},
    dt:{pa:'tu',ghichu:''},
    d1:{nguoi:'Đặng Thị Mai — Sales admin',ngay:'2026-09-22',kq:'',ykien:''},
    d2:{nguoi:'',ngay:'2026-09-23',kq:'',ykien:'',gia:{},fee:''},
    xd:{gia:{L1:'38000',L2:'7000',L3:'340000'},lydo:'',back:false,backNote:''},
    q2:{created:false,nguoi:'Bộ phận tìm nguồn cung',han:'2026-09-25',items:{P2:{ncc:'Cơ khí Lò xo Bình Dương',phuongan:'Mua ngoài',gia:'8000',hieuluc:'30 ngày kể từ 20/09/2026',tailieu:'',tt:'Chờ giá'}}},
    bt:{nvl:nvl,pk:{thuocdo:{ten:'Thước đo',dvt:'cái',gia:'5000',from:''}},nhom:nhom,r:'15',bxlen:'400000',bxxuong:'300000',

function loiW(D,H,T){return D*H*T/385000;}
function lineName(l){
  if(l.type==='loi') return 'Lõi giấy D'+fmt(n(l.d),0)+'×H'+fmt(n(l.h),0)+'×T'+fmt(n(l.t),1).replace(/,0$/,'');
  if(l.type==='v') return 'Thanh V '+fmt(n(l.c1),0)+'×'+fmt(n(l.c2),0)+'×'+fmt(n(l.t),0)+', dài '+fmtI(n(l.l))+'mm';
  return 'Thùng giấy OD'+fmt(n(l.od),0)+'×OH'+fmt(n(l.oh),0)+'×ID'+fmt(n(l.id),0)+'×IH'+fmt(n(l.ih),0);
}
function soChuyen(){return Math.max(1,Math.round(n(S.req.sochuyen))||1);}
function isGiao(){return S.req.vc!==VC_OPT[0];}
function useTable(){return S.req.vc==='Đường bộ'&&S.req.vcCach===VC_CACH[0];}
function vcText(){if(!isGiao())return 'khách tự nhận';
  return S.req.vc+(useTable()?' (biểu phí: '+S.req.khoangcach+', xe '+S.req.loaixe+')':' (tùy chỉnh '+fmtI(n(S.req.vcTuy))+' đ/chuyến)')+', '+soChuyen()+' chuyến; bốc xếp xuống: '+S.req.bxx+(S.req.bxx===BXX[2]?' '+fmtI(n(S.req.bxxTuy))+' đ/chuyến':'');}
function lineValid(l){
  const cfg=S.kt.bom[l.uid]||{src:'calc'};if(n(l.sl)<=0)return false;
  if(l.type==='loi') return cfg.src==='tay'?(n(cfg.chip)>0):(n(l.d)>0&&n(l.h)>0&&n(l.t)>0);
  if(l.type==='v') return cfg.src==='tay'?(n(cfg.carton)+n(cfg.testliner)>0):(n(l.c1)>0&&n(l.c2)>0&&n(l.t)>0&&n(l.l)>0);
  return n(l.od)>0&&n(l.oh)>0&&n(l.id)>0&&n(l.ih)>0;
}
function bomLine(l){
  const cfg=S.kt.bom[l.uid]||{src:'calc'};const c=[];let W=null,info={};
  if(l.type==='loi'){
    if(cfg.src==='tay'){c.push({k:'chip',q:n(cfg.chip),f:'Nhập tay'},{k:'mk32',q:n(cfg.mk32),f:'Nhập tay'});}
    else{W=loiW(n(l.d),n(l.h),n(l.t));c.push({k:'chip',q:W*0.965,f:'W × 0,965'},{k:'mk32',q:W*0.135,f:'W × 0,135'});}
  }else if(l.type==='v'){
    if(cfg.src==='tay'){c.push({k:'carton',q:n(cfg.carton),f:'Nhập tay'},{k:'testliner',q:n(cfg.testliner),f:'Nhập tay'},{k:'mk32',q:n(cfg.mk32),f:'Nhập tay'});}
    else{const Wm=(n(l.c1)+n(l.c2)-n(l.t))*n(l.t)*0.7/1000;W=Wm*n(l.l)/1000;info.Wm=Wm;
      c.push({k:'carton',q:W*0.72,f:'W × 0,72'},{k:'testliner',q:W*0.18,f:'W × 0,18'},{k:'mk32',q:W*0.10,f:'W × 0,10'});}
  }else{
    const ch=S.bt.chuan,od=n(l.od),oh=n(l.oh),id=n(l.id),ih=n(l.ih);
    const kH=(oh+ih)/((n(ch.oh)+n(ch.ih))||1),kOD=od/(n(ch.od)||1),kID=id/(n(ch.id)||1);
    const wn=loiW(od,oh+30,4),wt=loiW(id,ih,3.8);info={kH:kH,kOD:kOD,kID:kID,wn:wn,wt:wt};
    c.push({k:'ktt',q:0.02*kH,f:'0,02 × k_H'},{k:'primal',q:0.15*kH,f:'0,15 × k_H'},{k:'son',q:0.013*kH,f:'0,013 × k_H'},
      {k:'dt60',q:1.1*kOD,f:'1,1 × k_OD'},{k:'dt50',q:0.27*kID,f:'0,27 × k_ID'},
      {k:'napday',q:1,f:'Cố định 1'},{k:'quaixach',q:1,f:'Cố định 1'},{k:'daikep',q:1,f:'Cố định 1'},{k:'napgo',q:1,f:'Cố định 1'},
      {k:'chip',q:wn*0.965,f:'Lõi ngoài D'+fmt(od,0)+'×H'+fmt(oh+30,0)+'×T4: W × 0,965'},{k:'mk32',q:wn*0.135,f:'Lõi ngoài: W × 0,135'},
      {k:'chip',q:wt*0.965,f:'Lõi trong D'+fmt(id,0)+'×H'+fmt(ih,0)+'×T3,8: W × 0,965'},{k:'mk32',q:wt*0.135,f:'Lõi trong: W × 0,135'});
    (l.pk||[]).forEach(p=>{
      if(p.src==='dm') c.push({k:'pk:'+p.key,q:n(p.sl),f:p.fromQT2?'Phụ kiện đi kèm (giá từ QT2)':'Phụ kiện đi kèm (danh mục)'});
      else c.push({k:'pkm:'+p.uid,q:n(p.sl),f:'Phụ kiện mới — chờ giá'});
    });
  }
  return {c:c,W:W,info:info,cfg:cfg};
}
function findPk(uid){for(const l of S.req.lines)for(const p of (l.pk||[]))if(p.uid===uid)return{p:p,l:l};return null;}
function meta(k){
  if(NVL[k]) return NVL[k];
  if(k.indexOf('pk:')===0){const x=S.bt.pk[k.slice(3)]||{ten:'(không rõ)',dvt:'cái'};return{ma:'',ten:x.ten,dvt:x.dvt};}
  const f=findPk(k.slice(4));return{ma:'',ten:(f?f.p.ten||'Phụ kiện mới':'Phụ kiện mới'),dvt:'cái'};
}
function priceOf(k,pa){
  if(NVL[k]){const v=(S.bt.nvl[k]||{})[pa];return blank(v)?null:n(v);}
  if(k.indexOf('pk:')===0){const x=S.bt.pk[k.slice(3)];return(x&&!blank(x.gia))?n(x.gia):null;}
  return null; // phụ kiện mới chưa xác nhận giá: không bao giờ coi là 0
}
function svc(){
  const giao=isGiao(),soC=soChuyen(),bx1=n(S.bt.bxlen)*soC;
  let bxPer=0,bxNote='Không tính',bxMiss=false;
  if(giao&&S.req.bxx===BXX[1]){bxPer=n(S.bt.bxxuong);bxNote='Mức chuẩn ở Base Table';}
  else if(giao&&S.req.bxx===BXX[2]){bxPer=n(S.req.bxxTuy);bxNote='Sale tùy chỉnh';bxMiss=bxPer<=0;}
  let per=0,note='Khách tự nhận — không tính vận chuyển',vcMiss=false;
  if(giao){ if(useTable()){per=vcPrice(S.req.khoangcach,S.req.loaixe);note='Biểu phí đường bộ: '+S.req.khoangcach+', xe '+S.req.loaixe;}
    else{per=n(S.req.vcTuy);note=S.req.vc+' — Sale tùy chỉnh phí/chuyến'+(S.req.vcGhichu?' ('+S.req.vcGhichu+')':'');vcMiss=per<=0;} }
  return{giao:giao,soC:soC,bx1:bx1,bxPer:bxPer,bxNote:bxNote,bx2:bxPer*soC,per:per,vc:per*soC,tong:bx1+bxPer*soC+per*soC,note:note,vcMiss:vcMiss,bxMiss:bxMiss,miss:vcMiss||bxMiss};
}
function compute(pa){
  const s=svc(), c=n(S.req.hoahong)/100, a=n(S.req.ngayTC)/365*n(S.bt.r)/100;
  const lines=S.req.lines.map(l=>{
    const b=bomLine(l);let nvl=0;const miss=[];
    b.c.forEach(it=>{const p=priceOf(it.k,pa);if(p===null){if(miss.indexOf(it.k)<0)miss.push(it.k);}else nvl+=it.q*p;});
    const g=S.bt.nhom[l.type],sl=n(l.sl);
    const sx=nvl*n(g.sx)/100,gtsx=nvl+sx,ql=gtsx*n(g.ql)/100,dv=0,G=gtsx+ql,m=n(g.m)/100;
    const valid=lineValid(l), ok=valid&&miss.length===0;
    const P=ok?Math.round(G/(1-m)/(1-c)/(1-a)):null;
    return{l:l,b:b,miss:miss,valid:valid,ok:ok,nvl:nvl,sx:sx,gtsx:gtsx,ql:ql,dv:dv,G:G,P:P,m:m,sl:sl};
  });
  const ok=lines.length>0&&lines.every(x=>x.ok)&&!s.miss;
  const sp=lines.every(x=>x.ok)?lines.reduce((t,x)=>t+x.P*x.sl,0):null;
  return{lines:lines,s:s,c:c,a:a,ok:ok,sp:sp,fee:s.tong,total:sp==null?null:sp+s.tong,pa:pa};
}
function xinOf(x){return x.P;}
function xdVal(x){const v=S.xd.gia[x.uid];return blank(v)?x.P:n(v);}
function lnOf(G,price,c,a){const base=price*(1-c)*(1-a);return base?1-G/base:null;}
function lnTong(items,c,a,priceFn){let g=0,b=0;items.forEach(x=>{const p=priceFn(x);if(p==null)return;g+=x.G*x.sl;b+=p*(1-c)*(1-a)*x.sl;});return b?1-g/b:null;}
function lnDon(items,c,a,priceFn,feeCost,feePrice){let g=feeCost,b=feePrice;items.forEach(x=>{const p=priceFn(x);if(p==null)return;g+=x.G*x.sl;b+=p*(1-c)*(1-a)*x.sl;});return b?1-g/b:null;}
function cap2Of(items){return items.some(x=>x.xin<x.P)?'Trưởng phòng':'Sales admin';}
function pendingPk(){const r=[];S.req.lines.forEach((l,i)=>(l.pk||[]).forEach((p,j)=>{if(p.src==='moi'||p.fromQT2)r.push({p:p,l:l,i:i,j:j});}));return r;}
function sigOf(R){return JSON.stringify([R.pa,R.fee,R.lines.map(x=>[x.l.uid,Math.round(x.G*100),x.P,x.sl])]);}
function snapChanged(){if(!S.snap)return false;return sigOf(compute(S.dt.pa))!==S.snap.sig;}
function makeSnap(){
  const R=compute(S.dt.pa);
  const lines=R.lines.map(x=>({uid:x.l.uid,type:x.l.type,name:lineName(x.l),dvt:DVT[x.l.type],sl:x.sl,nvl:x.nvl,G:x.G,P:x.P,xin:x.P,xinBlank:true}));
  const used={};R.lines.forEach(x=>x.b.c.forEach(it=>{used[it.k]=priceOf(it.k,S.dt.pa);}));
  return{ma:MA_DT,time:now(),pa:S.dt.pa,c:R.c,a:R.a,r:n(S.bt.r),ngayTC:n(S.req.ngayTC),lines:lines,cap2:cap2Of(lines),total:R.total,sp:R.sp,fee:R.fee,feeNote:R.s.note,used:used,sig:sigOf(R),xinDone:false,lydo:''};
}

    else if(b.cfg.src==='tay') sub='Nguồn BOM: nhập tay định mức';
    else if(l.type==='loi') sub='W = D×H×T/385.000 = '+fmt(b.W,6)+' kg/cái';

function addLine(t){const uid='L'+(++S.seq.L);const l={uid:uid,type:t,sl:'',xin:''};
  if(t==='loi')Object.assign(l,{d:'',h:'',t:''});else if(t==='v')Object.assign(l,{c1:'',c2:'',t:'',l:''});else Object.assign(l,{od:'',oh:'',id:'',ih:'',pk:[]});
  S.req.lines.push(l);S.kt.bom[uid]={src:'calc'};save();renderMain();}
function rmLine(i){const l=S.req.lines[i];if(!confirm('Xoá dòng '+(i+1)+' — '+TYPE_L[l.type]+'?'))return;S.req.lines.splice(i,1);delete S.kt.bom[l.uid];save();renderMain();}
function addPk(i){const l=S.req.lines[i];l.pk=l.pk||[];l.pk.push({uid:'P'+(++S.seq.P),src:'dm',key:Object.keys(S.bt.pk)[0]||'',ten:'',quycach:'',sl:'1'});save();renderMain();}
function rmPk(i,j){S.req.lines[i].pk.splice(j,1);save();renderMain();}
function confirmPk(uid){const f=findPk(uid);if(!f)return;const it=S.q2.items[uid];const key='qt2_'+uid;
  S.bt.pk[key]={ten:f.p.ten||'Phụ kiện mới',dvt:'cái',gia:String(it.gia),from:'QT2 — '+(it.ncc||'NCC')+(it.hieuluc?', hiệu lực '+it.hieuluc:'')};
  f.p.src='dm';f.p.key=key;f.p.fromQT2=true;hist('QT2: xác nhận giá '+(f.p.ten||'phụ kiện mới')+' '+fmtI(n(it.gia))+' đ/cái, thêm vào danh mục','Người tính giá');save();renderMain();}
function unconfirmPk(uid){const f=findPk(uid);if(!f)return;delete S.bt.pk[f.p.key];f.p.src='moi';f.p.key='';f.p.fromQT2=false;save();renderMain();}
function act(a){
  if(a==='gui'){S.kt.tra=false;hist('Gửi yêu cầu tính giá '+MA_YC+' ('+S.req.lines.length+' dòng), n8n tính BOM & giá',S.req.nguoiyc);S.done.q1_0=1;return go('q1',1);}
  if(a==='tra'){hist('Trả Sale bổ sung: '+(S.kt.ykien||''),S.kt.nguoi);S.kt.tra=true;S.snap=null;S.approved=null;S.done.q1_0=0;S.done.q1_1=0;return go('q1',0);}
  if(a==='taoQT2'){S.q2.created=true;hist('Chuyển QT2 tìm nguồn: '+pendingPk().filter(x=>x.p.src==='moi').map(x=>x.p.ten||'phụ kiện mới').join(', '),S.kt.nguoi);return go('q2',0);}
  if(a==='chot'){const R=compute(S.dt.pa);if(!R.ok)return;S.snap=makeSnap();S.approved=null;S.xd.back=false;S.d1.kq='';S.d2.kq='';S.d2.gia={};S.d2.fee='';[2,3,4,5].forEach(k=>S.done['q1_'+k]=0);
    hist('Chốt dự toán '+MA_DT+', gửi giá đề xuất cho Sale',S.kt.nguoi);S.done.q1_1=1;return go('q1',2);}
  if(a==='xin'){const sp=S.snap;if(!sp)return;sp.lines.forEach(x=>{x.xinBlank=blank(S.xd.gia[x.uid]);x.xin=xdVal(x);});sp.cap2=cap2Of(sp.lines);sp.xinDone=true;sp.lydo=S.xd.lydo;S.xd.back=false;
    S.approved=null;S.d1.kq='';S.d2.kq='';S.d2.gia={};S.d2.fee='';hist('Sale gửi giá xin duyệt (cấp 2: '+sp.cap2+')',S.req.nguoiyc);S.done.q1_2=1;return go('q1',3);}
  const toSale=(note,who)=>{hist('Trả Sale điều chỉnh giá xin duyệt: '+(note||''),who);S.snap.xinDone=false;S.xd.back=true;S.xd.backNote=note;S.d1.kq='';S.d2.kq='';S.done.q1_2=0;S.done.q1_3=0;return go('q1',2);};
  const toCalc=(note,who,lvl)=>{hist('Cấp '+lvl+' trả về rà soát: '+(note||''),who);S.snap=null;S.approved=null;S.d1.kq='';S.d2.kq='';S.done.q1_1=0;S.done.q1_2=0;S.done.q1_3=0;return go('q1',1);};
  if(a==='d1'){if(S.d1.kq===D1_OK){hist('Duyệt cấp 1',S.d1.nguoi);S.done.q1_3=1;return go('q1',4);}
    if(S.d1.kq===D1_SALE) return toSale(S.d1.ykien,S.d1.nguoi);
    if(S.d1.kq===D1_BACK) return toCalc(S.d1.ykien,S.d1.nguoi,1);return;}
  if(a==='d2'){const sp=S.snap;const nguoi=S.d2.nguoi||(sp.cap2==='Trưởng phòng'?'Nguyễn Văn Long — Trưởng phòng Kinh doanh':'Đặng Thị Mai — Sales admin');

      hist('Duyệt cấp 2 ('+sp.cap2+'), trả giá cho Sale',nguoi);S.done.q1_4=1;S.done.q1_5=1;return go('q1',5);}

    if(S.d2.kq===D2_BACK) return toCalc(S.d2.ykien,nguoi,2);return;}
}

function rNN(){
  const R=compute(S.dt.pa);
  const node=(i,t,x)=>'<div class="co co-nn"><b class="t">Node '+i+' — '+t+'</b>'+x+'</div>';
  return '<div class="card nnc"><div class="card-h nn"><div class="badge b-nn">n8n</div><div><div class="card-t">Tính dự toán</div><div class="card-d">Số liệu bên dưới là kết quả trên dữ liệu hiện tại của '+MA_YC+'</div></div></div><div class="body">'
   +node(1,'Trigger','Chạy ngay khi Sale gửi yêu cầu (QT1 bước 1). Chạy lại khi người tính giá đổi nguồn BOM, QT2 xác nhận giá phụ kiện mới, hoặc bấm "Tính lại". Không tự tính lại dự toán đã chốt khi Base Table đổi.')
   +node(2,'Đọc dữ liệu','Lấy các dòng sản phẩm, phụ kiện, giao hàng, điều khoản từ QT1 bước 1; lựa chọn vận chuyển, bốc xếp của Sale; nguồn BOM ở bước 2 (mặc định tính từ quy cách); tra Base Table: đơn giá theo mã vật tư, phí xe theo khoảng cách × loại xe, BOM chuẩn thùng, mẫu dự toán theo nhóm SP.')
   +node(3,'Tính BOM từng dòng','Nguồn BOM: BOM chính thức → tính từ quy cách → nhập tay. Lõi: W = D×H×T/385.000. Thanh V: W = (C1+C2−T)×T×0,7/1000 × chiều dài. Thùng: k_H, k_OD, k_ID áp riêng từng dòng, không nhân chung; bung 2 lõi xuống giấy + keo, không cộng thêm giá lõi.')
   +dsec('Kết quả BOM',bomTable(R),false)
   +node(4,'Kiểm tra phụ kiện','Phụ kiện không có trong danh mục: đặt trạng thái "Chờ giá" và báo ở QT1 bước 2 — không tự tạo phiếu QT2; người tính giá chọn chuyển sang QT2 trên Service. Không bao giờ coi là 0 đồng; các dòng khác vẫn tính.')
   +node(5,'Tính chi phí','CP NVL = Σ(định mức × đơn giá). CP SX = CP NVL × % SX. CP QL = (CP NVL + CP SX) × % QL. CP dịch vụ = (bốc xếp lên + bốc xếp xuống + vận chuyển) × số chuyến, tính một lần cho cả đơn — không phân bổ vào từng dòng sản phẩm.')
   +dsec('Phí dịch vụ của đơn',svcTable(R),false)
   +node(6,'Giá vốn & giá đề xuất','G (từng dòng) = Giá thành SX + CP QL. P = ROUND(G/(1−m)/(1−c)/(1−a), 0), a = n/365 × r. LN theo giá xin duyệt = 1 − G/[P_xin × (1−c) × (1−a)]; toàn đơn tính theo tổng tiền (gồm phí dịch vụ trọn đơn), không lấy trung bình tỷ lệ. Xác định người duyệt cấp 2.')
   +dsec('Kết quả giá',priceTable(R,false),true)
   +co('danger','Cần chốt với doanh nghiệp','Sheet TINH GIA dùng mẫu số (1 − a); sheet tổng hợp mô tả chi phí trả chậm dạng cộng thêm (số ngày × đơn giá × lãi suất/365). Các ô G23:G25 (thuế TNDN, LN sau thuế) có lỗi logic nên không dùng. CP MOQ chưa đưa vào giá.')
   +node(7,'Ghi kết quả','Ghi BOM và giá về QT1 bước 2 cho người tính giá. Sale chỉ nhận giá đề xuất khi người tính giá chốt (bước 3) và giá được duyệt (bước 6). Khi chốt: lưu bản chụp định mức, đơn giá, tham số đã dùng vào phiếu dự toán.')
   +'</div></div>';
}

function chainSVG(){
  const W=140,H=58,Y=74,X=[10,168,326,484,642,800],C='#1D4E89';
  const box=(x,y,num,a,b,c,dash)=>'<g><rect x="'+x+'" y="'+y+'" width="'+W+'" height="'+H+'" rx="8" fill="#fff" stroke="'+c+'" stroke-width="1.5"'+(dash?' stroke-dasharray="5 3"':'')+'/><text x="'+(x+10)+'" y="'+(y+18)+'" font-size="11" font-weight="700" fill="'+c+'">'+num+'</text><text x="'+(x+10)+'" y="'+(y+35)+'" font-size="11.5" font-weight="600" fill="#1f2937">'+a+'</text><text x="'+(x+10)+'" y="'+(y+50)+'" font-size="10" fill="#6b7280">'+b+'</text></g>';
  const L=[['1','Sale gửi yêu cầu','Sale'],['2','Tính BOM & giá','Người tính giá chốt'],['3','Sale xin duyệt','Xem giá đề xuất'],['4','Duyệt cấp 1','Sales admin'],['5','Duyệt cấp 2','SA hoặc Trưởng phòng'],['6','Sale nhận giá','→ lập báo giá']];
  let g='';L.forEach((s,i)=>{g+=box(X[i],Y,s[0],s[1],s[2],C,false);if(i<5)g+='<line x1="'+(X[i]+W)+'" y1="'+(Y+29)+'" x2="'+(X[i+1]-2)+'" y2="'+(Y+29)+'" stroke="'+C+'" stroke-width="1.5" marker-end="url(#ab)"/>';});
  const back=(x1,x2,top,label,lx)=>'<path d="M'+x1+' '+Y+' C'+x1+' '+top+', '+x2+' '+top+', '+x2+' '+(Y-2)+'" fill="none" stroke="#B5560F" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ao)"/><text x="'+lx+'" y="'+(top+6)+'" font-size="10" fill="#B5560F">'+label+'</text>';
  g+=back(220,80,40,'Thiếu thông tin → trả Sale',90)+back(554,396,44,'Điều chỉnh giá xin',432)+back(712,238,12,'Trả Sale (bước 3) hoặc người tính giá (bước 2)',330);
  g+='<text x="10" y="200" font-size="10.5" font-weight="600" fill="#6b7280">Chạy ngầm</text>';
  g+=box(10,210,'BT','Base Table','Đơn giá, BOM, phí','#475569',true)+box(168,210,'n8n','Tính BOM & giá','Chạy khi Sale gửi','#7C3AED',true)+box(400,210,'QT2','Tìm nguồn NCC','Người tính giá chuyển','#6B3FA0',false);
  g+='<line x1="150" y1="239" x2="166" y2="239" stroke="#475569" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ag)"/>';
  g+='<line x1="80" y1="'+(Y+H)+'" x2="190" y2="208" stroke="#7C3AED" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#av)"/>';
  g+='<line x1="238" y1="210" x2="238" y2="'+(Y+H+2)+'" stroke="#7C3AED" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#av)"/>';
  g+='<line x1="285" y1="'+(Y+H)+'" x2="430" y2="208" stroke="#6B3FA0" stroke-width="1.3" marker-end="url(#ap)"/><line x1="460" y1="210" x2="300" y2="'+(Y+H+2)+'" stroke="#6B3FA0" stroke-width="1.3" marker-end="url(#ap)"/>';
  g+='<text x="470" y="176" font-size="10" fill="#6B3FA0">chưa có NCC → chuyển QT2; có giá → vào danh mục, tính lại</text>';
  const mk=(id,c)=>'<marker id="'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="'+c+'" stroke-width="1.6" stroke-linecap="round"/></marker>';
  return '<div class="tw" style="margin:4px 0 14px"><svg viewBox="0 0 950 284" style="min-width:760px;width:100%;font-family:\'Be Vietnam Pro\',system-ui,sans-serif" role="img" aria-label="Sơ đồ luồng quy trình"><defs>'+mk('ab',C)+mk('ao','#B5560F')+mk('ag','#475569')+mk('av','#7C3AED')+mk('ap','#6B3FA0')+'</defs>'+g+'</svg></div>';
}
function rOV(){
  const card=(v,st,c,t,d)=>'<button class="flowcard" style="border-color:'+c+';border-left-color:'+c+'" onclick="go(\''+v+'\')"><div class="ft" style="color:'+c+'">'+t+'</div><div class="fd">'+d+'</div><div class="fs">'+st.map((s,i)=>'<span class="'+(S.done[v+'_'+i]?'d':'')+'">'+s.c+'. '+esc(s.t)+'</span>').join('')+'</div></button>';
  const Y='<span class="y">✓</span>',P=t=>'<span class="p">'+t+'</span>',N='<span class="no">—</span>';
  const vis=[['Thông tin yêu cầu',Y,Y,Y,Y,P('Phụ kiện mới')],['BOM & nhu cầu vật tư',N,Y,P('Tóm tắt'),P('Tóm tắt'),N],['Chi phí, giá vốn',N,Y,Y,Y,N],['Giá đề xuất',Y,Y,Y,Y,N],['Lợi nhuận theo giá xin',N,Y,Y,Y,N],['Đơn giá được duyệt',Y,Y,Y,Y,N]]
    .map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>');
  return '<div class="card"><div class="body">'
   +sec('Luồng xử lý',chainSVG())
   +co('info','Ba nguyên tắc bất biến','1. Mỗi sản phẩm trong yêu cầu có BOM và đơn giá riêng, không gộp chung.<br>2. Giá mua thay đổi thì cập nhật bảng giá; quy cách/định mức thay đổi thì cập nhật BOM.<br>3. Cập nhật giá NVL không tự sửa dự toán đã chốt/duyệt; lần báo giá sau luôn tạo yêu cầu mới và duyệt lại.')
   +'<div class="sec"><div class="sec-t">Quy trình người dùng</div>'
   +card('q1',Q1,'#1D4E89','QT1 — Yêu cầu tính giá & duyệt dự toán','Một phiếu xuyên suốt: Sale gửi → n8n tính BOM & giá, người tính giá chốt → Sale xem giá đề xuất, nhập giá xin duyệt → duyệt 2 cấp → Sale nhận đơn giá.')
   +card('q2',Q2,'#6B3FA0','QT2 — Tìm nguồn phụ kiện mới','Người tính giá chuyển sang từ QT1 bước 2 khi phụ kiện chưa có nhà cung cấp; xong thì dự toán QT1 được tính lại.')+'</div>'
   +sec('Ai thấy thông tin gì',tbl(['Thông tin','Sale','Người tính giá','Sales admin','Trưởng phòng','Bộ phận tìm nguồn'],vis)+'<div class="fhint">Đề xuất triển khai theo buổi trao đổi ("Sale không được phân quyền dữ liệu này, chỉ cần biết giá cuối cùng") — phân quyền chi tiết cần doanh nghiệp chốt.</div>','đề xuất')
   +co('warn','Điểm chưa chốt — demo đang dùng phương án minh họa','BOM lõi: công thức cho 1,827/0,256 kg, sheet TINH GIA nhập 1,95/0,2835 kg (xem được cả hai ở QT1 bước 2, chọn "Nhập tay") · hệ số lõi tổng 110% · công thức thanh V chưa nhất quán đơn vị · OD515 hay OD506,5 · quy tắc 2 lõi trong thùng · phụ kiện cố định đổi mã theo size · phí dịch vụ trọn đơn thu đúng chi phí hay cộng LN, hoa hồng, trả chậm · MOQ chưa đưa vào giá · công thức trả chậm giữa 2 sheet · Sale nhập giá xin duyệt sau khi xem giá đề xuất (buổi trao đổi) hay ngay trong yêu cầu (sheet tổng hợp) · 2 cấp cùng Sales admin là 2 lượt hay 1 · đơn nhiều dòng khi chỉ một dòng xin thấp hơn đề xuất · ai cập nhật đơn giá NVL và tần suất.')
   +'<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" onclick="window.print()">In trang</button><button class="btn" onclick="resetAll()">Xoá dữ liệu nhập thử</button></div>'
   +'</div></div>';
}
function resetAll(){if(!confirm('Xoá toàn bộ dữ liệu đã nhập thử trong trình duyệt?'))return;S=mkDefault();save();render();}

/* =====================================================================
   BINDING
   ===================================================================== */
function onEdit(e){const t=e.target;if(!t||!t.dataset||!t.dataset.b)return;setPath(t.dataset.b,t.value);save();refresh();}
document.addEventListener('input',onEdit);
document.addEventListener('change',e=>{onEdit(e);if(e.target&&e.target.dataset&&e.target.dataset.rr){renderMain();rStepnav();}});

render();
</script>
