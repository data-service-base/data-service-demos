<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Quy trình truy xuất nguồn gốc — Cao su Chư Sê (Gia Lai)</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap');
:root{
  --blue:#185FA5;--blue-dark:#0F3460;--blue-light:#E6F1FB;--blue-xl:#F0F6FD;
  --teal:#1A7A5E;--teal-dark:#0A4D3C;--teal-light:#E1F5EE;--teal-xl:#F0FAF6;
  --purple:#7B2FA0;--purple-dark:#3D1C72;--purple-light:#F0E8FA;--purple-xl:#F8F4FD;
  --orange:#C25B10;--orange-dark:#7A3208;--orange-light:#FDE8D8;--orange-xl:#FEF4EE;
  --amber:#854F0B;--amber-light:#FAEEDA;
  --green:#3B6D11;--green-light:#EAF3DE;
  --red:#A32D2D;--red-light:#FEE8E8;
  --g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g300:#D1D5DB;
  --g400:#9CA3AF;--g500:#6B7280;--g700:#374151;--g900:#111827;
  --w:#fff;--r:8px;--sh:0 1px 4px rgba(0,0,0,.08);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--g100);color:var(--g900);font-size:14px}

.hdr{padding:26px 36px;color:#fff}
.hdr-0{background:linear-gradient(135deg,var(--blue-dark),var(--blue))}
.hdr-1{background:linear-gradient(135deg,var(--teal-dark),var(--teal))}
.hdr-2{background:linear-gradient(135deg,var(--purple-dark),var(--purple))}
.hdr-3{background:linear-gradient(135deg,var(--orange-dark),var(--orange))}
.hdr-badge{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;display:inline-block;margin-bottom:10px}
.hdr h1{font-size:21px;font-weight:700;margin-bottom:4px}
.hdr p{font-size:13px;opacity:.75}

.flow-tabs{background:var(--w);border-bottom:1px solid var(--g200);display:flex;overflow-x:auto}
.ftab{padding:13px 18px;font-size:12.5px;font-weight:500;color:var(--g500);cursor:pointer;border:none;background:none;border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit;transition:all .15s}
.ftab:hover{color:var(--g700)}
.ftab.fa0{color:var(--blue);border-bottom-color:var(--blue)}
.ftab.fa1{color:var(--teal);border-bottom-color:var(--teal)}
.ftab.fa2{color:var(--purple);border-bottom-color:var(--purple)}
.ftab.fa3{color:var(--orange);border-bottom-color:var(--orange)}
.ftab.fa-ov{color:#1a1a2e;border-bottom-color:#1a1a2e;font-weight:600}

.fk-tag{display:inline-block;border-radius:9px;padding:0 7px;font-size:9.5px;font-weight:700;margin-left:6px;vertical-align:middle}
.t-fill{background:#FDE8D8;color:#7A3208;border:1px solid #C25B10}
.t-auto{background:var(--g200);color:var(--g500);border:1px solid var(--g400)}
.t-inh{background:var(--teal-light);color:var(--teal);border:1px solid var(--teal)}
.fk-fill input,.fk-fill select,.fk-fill textarea{background:var(--w);border-color:#E3B892}
.fk-fill input:hover,.fk-fill select:hover,.fk-fill textarea:hover{border-color:var(--orange)}

.step-nav{background:var(--w);border-bottom:1px solid var(--g200);position:sticky;top:env(safe-area-inset-top,0px);z-index:100;overflow-x:auto}
.snav-inner{display:flex;align-items:center;padding:10px 28px;min-width:max-content}
.snav-item{display:flex;align-items:center;cursor:pointer}
.snav-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--g300);background:var(--w);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--g400);flex-shrink:0;transition:all .2s}
.snav-label{font-size:10px;color:var(--g500);font-weight:500;margin-left:6px;margin-right:2px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snav-line{width:16px;height:2px;background:var(--g200);flex-shrink:0}
.s0 .snav-item.sa .snav-dot{background:var(--blue);border-color:var(--blue);color:#fff}
.s1 .snav-item.sa .snav-dot{background:var(--teal);border-color:var(--teal);color:#fff}
.s2 .snav-item.sa .snav-dot{background:var(--purple);border-color:var(--purple);color:#fff}
.s3 .snav-item.sa .snav-dot{background:var(--orange);border-color:var(--orange);color:#fff}
.snav-item.sd .snav-dot{background:var(--green-light);border-color:var(--green);color:var(--green)}
.snav-item.sd .snav-line{background:var(--green)}

.main{max-width:1080px;margin:26px auto;padding:0 18px 60px}
.sc{background:var(--w);border:1px solid var(--g200);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
.sc-hdr{padding:17px 22px;border-bottom:1px solid var(--g200);display:flex;align-items:center;gap:12px}
.sc-hdr-0{background:var(--blue-xl)}.sc-hdr-1{background:var(--teal-xl)}.sc-hdr-2{background:var(--purple-xl)}.sc-hdr-3{background:var(--orange-xl)}
.sc-badge{min-width:34px;height:34px;border-radius:50%;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.sb0{background:var(--blue)}.sb1{background:var(--teal)}.sb2{background:var(--purple)}.sb3{background:var(--orange)}
.sc-title{font-size:15px;font-weight:600;margin-bottom:2px}
.sc-title-0{color:var(--blue-dark)}.sc-title-1{color:var(--teal-dark)}.sc-title-2{color:var(--purple-dark)}.sc-title-3{color:var(--orange-dark)}
.sc-desc{font-size:12px;color:var(--g500)}

.ibar{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--g200)}
.ibar-item{padding:9px 16px;border-right:1px solid var(--g200)}
.ibar-item:last-child{border-right:none}
.ilbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--g400);margin-bottom:2px}
.ival{font-size:12px;color:var(--g700);font-weight:500}

.fb{padding:20px 22px}
.fs{margin-bottom:22px}
.fs:last-child{margin-bottom:0}
.stitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;padding-bottom:5px;border-bottom:2px solid}
.st0{color:var(--blue);border-color:var(--blue-light)}.st1{color:var(--teal);border-color:var(--teal-light)}
.st2{color:var(--purple);border-color:var(--purple-light)}.st3{color:var(--orange);border-color:var(--orange-light)}
.fg{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.fgrp.full{grid-column:1/-1}
.fgrp label{display:block;font-size:10px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.fgrp input,.fgrp textarea,.fgrp select{width:100%;padding:7px 11px;border:1px solid var(--g300);border-radius:var(--r);font-family:inherit;font-size:13px;color:var(--g900);background:var(--g50);transition:border .15s;resize:vertical}
.fgrp input:focus,.fgrp textarea:focus,.fgrp select:focus{outline:none;border-color:var(--blue);background:var(--w);box-shadow:0 0 0 2px rgba(24,95,165,.08)}
.fgrp textarea{min-height:60px}
.fgrp input[readonly]{background:var(--g100);color:var(--g700);font-weight:600}
.req::after{content:' *';color:var(--red)}
.fhint{font-size:10.5px;color:var(--g400);margin-top:3px;font-weight:400}

.tw{overflow-x:auto;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--g100);padding:7px 8px;text-align:left;font-size:9.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--g500);border:1px solid var(--g200);white-space:nowrap}
th .inh-note{display:block;font-weight:500;text-transform:none;letter-spacing:0;color:var(--teal);font-size:9.5px;margin-top:1px}
td{padding:4px 5px;border:1px solid var(--g200);vertical-align:middle}
td input,td select{width:100%;border:none;background:transparent;font-family:inherit;font-size:12.5px;color:var(--g900);padding:2px 3px;min-height:26px}
td input:focus,td select:focus{outline:1px solid var(--blue);border-radius:3px;background:var(--blue-xl)}
td input[readonly]{background:var(--teal-xl);color:var(--teal-dark);font-weight:600}
select.pick{font-weight:600;color:var(--blue);background:var(--blue-xl);border-radius:4px}
tfoot td{background:var(--g100);font-weight:700}
.tadd{margin-top:6px;font-size:12px;cursor:pointer;font-weight:500;background:none;border:1px dashed;border-radius:6px;padding:5px 12px;width:100%;font-family:inherit}
.tadd-0{color:var(--blue);border-color:var(--blue)}.tadd-1{color:var(--teal);border-color:var(--teal)}
.tadd-2{color:var(--purple);border-color:var(--purple)}.tadd-3{color:var(--orange);border-color:var(--orange)}
.tdel{background:none;border:none;color:var(--g400);cursor:pointer;font-size:15px;padding:0 4px}
.tdel:hover{color:var(--red)}

.callout{border-radius:8px;padding:11px 14px;font-size:12.5px;line-height:1.55;margin-bottom:14px}
.co-warn{background:var(--amber-light);border:1px solid var(--amber);color:#5c3706}
.co-info{background:var(--blue-light);border:1px solid var(--blue);color:var(--blue-dark)}
.co-auto{background:var(--teal-light);border:1px solid var(--teal);color:var(--teal-dark)}
.co-t{font-weight:700;display:block;margin-bottom:2px}

.ck-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--g100)}
.tf{background:var(--g100);border-top:2px solid var(--g300);padding:6px 8px;font-size:12.5px;font-weight:700}
.tf-lbl{font-size:10px;letter-spacing:.05em;color:var(--g500);text-align:center}
.tv-blue{color:var(--blue)}.tv-teal{color:var(--teal)}.tv-amber{color:var(--amber)}.tv-green{color:var(--green)}.tv-brown{color:#6B4226}

.navr{display:flex;justify-content:space-between;align-items:center;padding:13px 22px;border-top:1px solid var(--g200);background:var(--g50);gap:10px;flex-wrap:wrap}
.navc{font-size:12px;color:var(--g500)}
.navb{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 16px;border-radius:8px;border:1px solid var(--g300);background:var(--w);color:var(--g700);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{background:var(--g100)}
.btn-p0{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-p1{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn-p2{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn-p3{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn-ok{background:var(--green-light);color:var(--green);border-color:var(--green)}
.num-right{text-align:right}
@media print{.flow-tabs,.step-nav,.navr,.tadd,.tdel{display:none!important}.main{margin:0;max-width:100%}.sc{box-shadow:none}body{background:#fff}}
@media(max-width:700px){
  .fg,.ibar{grid-template-columns:1fr}
  .ibar-item{border-right:none;border-bottom:1px solid var(--g200)}
  .main{padding:0 10px 40px}.hdr{padding:18px}.snav-label{display:none}
}

.fk-legend{display:flex;flex-wrap:wrap;gap:16px;padding:8px 22px;border-bottom:1px solid var(--g200);background:var(--g50);font-size:11px;color:var(--g500);align-items:center}
.fk-inh input[readonly],.fk-inh select{background:var(--teal-xl);border-color:#9fd6c3;color:var(--teal-dark);font-weight:600}
.fk-auto input[readonly]{background:var(--g100)}
th .th-k{display:block;font-weight:600;text-transform:none;letter-spacing:0;font-size:9.5px;margin-top:1px}
.th-fill{color:#C25B10}.th-inh{color:var(--teal)}.th-auto{color:var(--g500)}
td input.num-right[readonly]{text-align:right}
.btn-line{margin:4px 0 10px;display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="hdr-wrap"></div>
<div class="flow-tabs" id="flow-tabs"></div>
<div class="step-nav" id="step-nav"></div>
<div class="main"><div class="sc" id="sc"></div></div>

<script>
/* ============================================================
   DEMO TRẢI NGHIỆM NHẬP LIỆU — Cao su Chư Sê (Gia Lai)
   Kiến trúc thật: Base Table + n8n. Mỗi giai đoạn gồm:
     Bước LỌC (chỉ có trường điền)  →  Bước BẢNG TRẢ VỀ (kế thừa + điền)  →  chốt/duyệt
   Quy ước trường:  ✎ Điền (người dùng nhập) · ↩ Kế thừa (lấy từ bước trước, không sửa) · ⚙ Tự tính (n8n/hệ thống)
   Số liệu mẫu lấy từ sổ BM02B/03/06B/07A/08A/09, phiếu nhập kho, lệnh SX, KHSX, bảng NL-TP, chứng chỉ, DDS.
   ============================================================ */
const DOI = ['Đội Ia Glai','Đội Ia Hlốp','Đội Ia Ko','Đội Ia Tiêm'];
const HO_OPTS = ['','Hồ3/1/100p','Hồ4/1/100p','Hồ3/2/100p'];
const LOAI_SVR = ['SVR3L','SVR5','SVR10','RSS3'];
const KHU_LUU = ['B1 — Pallet','B2 — Pallet','A3 — Hàng rời'];
const KQ = ['','✓ Đạt — chuyển bước sau','✗ Không đạt — xử lý lại'];
const D1='2025-06-01', D2='2025-06-02', D3='2025-06-03';

/* ---------- helpers dữ liệu ---------- */
function ss(k,v){ try{ if(v===undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k,v);}catch(e){return null} }
function esc(v){ return (v===undefined||v===null?'':String(v)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function n(v){ const x=parseFloat(String(v==null?'':v).replace(/,/g,'')); return isNaN(x)?0:x; }
function fmt(x){ return (Math.round(x*100)/100).toLocaleString('vi-VN'); }
function dm(d){ const m=/^\d{4}-(\d{2})-(\d{2})$/.exec(d||''); return m? m[2]+'/'+m[1] : ''; }
function addDay(d,k){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d); return new Date(Date.UTC(+m[1],+m[2]-1,+m[3]+k)).toISOString().slice(0,10); }
function setM(id,val){ const e=document.getElementById(id); if(e) e.innerHTML=val; }
function setRO(id,v){ const e=document.getElementById(id); if(e) e.value=v; }

/* ---------- Dữ liệu nguồn: BM02B (phiếu giao nhận mủ nước) ---------- */
const PHIEU_RAW = [
 [D1,'15733','10h50','Khu vực 1','Đội Ia Hlốp',4870,'Hồ3/1/100p'],
 [D1,'15710','11h30','Khu vực 1','Đội Ia Glai',4800,'Hồ3/1/100p'],
 [D1,'25304','11h50','Khu vực 3','Đội Ia Glai',5040,'Hồ3/1/100p'],
 [D1,'25223','12h40','Khu vực 2','Đội Ia Hlốp',4850,'Hồ4/1/100p'],
 [D1,'25396','13h20','Khu vực 4','Đội Ia Hlốp',2850,'Hồ4/1/100p'],
 [D1,'15733','13h25','Khu vực 2','Đội Ia Glai',4850,'Hồ4/1/100p'],
 [D1,'15528','14h00','Khu vực 4','Đội Ia Glai',4950,'Hồ3/2/100p'],
 [D1,'25223','14h10','Khu vực 3','Đội Ia Hlốp',4810,'Hồ3/2/100p'],
 [D2,'15733','10h50','Khu vực 1','Đội Ia Hlốp',4800,'Hồ3/1/100p'],
 [D2,'15710','11h30','Khu vực 1','Đội Ia Glai',5120,'Hồ3/1/100p'],
 [D2,'25304','11h50','Khu vực 3','Đội Ia Glai',5100,'Hồ3/1/100p'],
 [D2,'25223','12h40','Khu vực 2','Đội Ia Hlốp',5100,'Hồ4/1/100p'],
 [D2,'25396','12h50','Khu vực 2','Đội Ia Glai',5200,'Hồ4/1/100p'],
 [D2,'15528','13h00','Khu vực 4','Đội Ia Glai',5000,'Hồ3/2/100p'],
 [D2,'25223','13h10','Khu vực 3','Đội Ia Hlốp',5500,'Hồ3/2/100p']
];
const PHIEU = PHIEU_RAW.map((r,i,a)=>{
  const seq=a.slice(0,i).filter(x=>x[0]===r[0]).length+1;
  return {ma_phieu:'GN-'+r[0].slice(8,10)+r[0].slice(5,7)+'-'+String(seq).padStart(2,'0'),
          ngay:r[0],so_xe:r[1],gio:r[2],kv:r[3],doi:r[4],kl_tuoi:String(r[5]),ho:r[6]};
});
/* DRC & quy khô ghi theo từng hồ trên sổ BM02B */
const HO_LAB = {
 '01/06 · Hồ3/1/100p':{drc:'30.8',kho:'4530'}, '01/06 · Hồ4/1/100p':{drc:'30.8',kho:'3865'}, '01/06 · Hồ3/2/100p':{drc:'30.8',kho:'3006'},
 '02/06 · Hồ3/1/100p':{drc:'31.0',kho:'4648'}, '02/06 · Hồ4/1/100p':{drc:'31.0',kho:'3187'}, '02/06 · Hồ3/2/100p':{drc:'31.0',kho:'3249'}
};

/* ---------- Dữ liệu nguồn: BM09 / phiếu nhập kho (lô thành phẩm) ---------- */
const LO_BASE = {sp:'SVR3L',tl_banh:'35 kg',dongoi:'Pa lét',tt_sp:'Tốt',khuluu:'B1 — Pallet',ghichu:'Pe; mỏng tem ngoài pa lét gỗ'};
const LO = [
 Object.assign({},LO_BASE,{ma_lo:'TP-0206-01',lo_so:'ĐM01',ngay:D2,tg_nk:'8h20',so_banh:'72',kl_kg:'2520',xeplop:'6'}),
 Object.assign({},LO_BASE,{ma_lo:'TP-0206-02',lo_so:'ĐM02',ngay:D2,tg_nk:'',so_banh:'72',kl_kg:'2520',xeplop:'6'}),
 Object.assign({},LO_BASE,{ma_lo:'TP-0206-03',lo_so:'ĐM03',ngay:D2,tg_nk:'',so_banh:'72',kl_kg:'2520',xeplop:'6'}),
 Object.assign({},LO_BASE,{ma_lo:'TP-0206-04',lo_so:'ĐM04',ngay:D2,tg_nk:'',so_banh:'72',kl_kg:'2520',xeplop:'6'}),
 Object.assign({},LO_BASE,{ma_lo:'TP-0206-05',lo_so:'',ngay:D2,tg_nk:'13h30',so_banh:'38',kl_kg:'1330',xeplop:'7',khuluu:'B2 — Pallet'}),
 Object.assign({},LO_BASE,{ma_lo:'TP-0306-01',lo_so:'ĐM05',ngay:D3,tg_nk:'8h20',so_banh:'34',kl_kg:'1190',xeplop:'6'}),
 Object.assign({},LO_BASE,{ma_lo:'TP-0306-02',lo_so:'ĐM06',ngay:D3,tg_nk:'',so_banh:'72',kl_kg:'2520',xeplop:'6'}),
 Object.assign({},LO_BASE,{ma_lo:'TP-0306-03',lo_so:'ĐM07',ngay:D3,tg_nk:'',so_banh:'72',kl_kg:'2520',xeplop:'6'}),
 Object.assign({},LO_BASE,{ma_lo:'TP-0306-04',lo_so:'ĐM08',ngay:D3,tg_nk:'12h00',so_banh:'72',kl_kg:'2520',xeplop:'6'}),
 Object.assign({},LO_BASE,{ma_lo:'TP-0306-05',lo_so:'',ngay:D3,tg_nk:'13h20',tl_banh:'33.333 kg',so_banh:'70',kl_kg:'2333',dongoi:'Rời',xeplop:'6',khuluu:'A3 — Hàng rời',ghichu:'Pe; mỏng tem ngoài hàng rời'})
];

/* ---------- truy cập state các bước trước ---------- */
let state = {};
function SS(f,s){ return state[f+'_'+s]||{}; }
function fv(f,s,id,def){ const v=SS(f,s)[id]; return (v===undefined||v==='')? def : v; }
function rowsOr(f,s,tid,fb){ const r=SS(f,s)[tid]; return (r&&r.length)? r : fb(); }
function mergeTpl(tpls,key,o){ const t=tpls.find(x=>String(x[key])===String(o[key])&&o[key]!==''); return t? Object.assign({},t,o) : o; }
function expand(s){ const out=[]; String(s||'').split(/[,;]/).forEach(p=>{ const m=/(\d+)\s*[–-]\s*(\d+)/.exec(p); if(m){ for(let i=+m[1];i<=+m[2];i++) out.push(i); } else { const k=/\d+/.exec(p); if(k) out.push(+k[0]); } }); return out; }
function inRange(d,tu,den){ return d>=tu && d<=den; }

/* ---------- QT1: lọc phiếu → danh sách phiếu → gom hồ ---------- */
function phieuPool(){
  const tu=fv(0,0,'tn1_tu',D1), den=fv(0,0,'tn1_den',D2), doi=fv(0,0,'tn1_doi','Tất cả');
  return PHIEU.filter(p=>inRange(p.ngay,tu,den)&&(doi==='Tất cả'||p.doi===doi));
}

const DT_VUNG={'Đội Ia Glai':'1453.03','Đội Ia Hlốp':'1023.64'};
function loXuatPool(){
  const tu=fv(3,0,'xh1_tu',D2), den=fv(3,0,'xh1_den',D3), qc=fv(3,0,'xh1_qc','35 kg');

}
function xh2Default(){ return loXuatPool(); }
function loXuat(){ return rowsOr(3,1,'xh2_list',xh2Default); }
function loSoXuat(){ return loXuat().filter(r=>r.lo_so).map(r=>r.lo_so.replace('ĐM','')).join(';'); }
function klXuatKg(){ return loXuat().reduce((s,r)=>s+n(r.kl_xuat),0); }
/* Truy ngược: lô nhập kho ngày d ← nguyên liệu cấp ngày d-1 (theo bảng theo dõi cấp NL–TP của khách) */
function truyNguoc(){
  const g={}, order=[];
  loXuat().forEach(r=>{ if(!r.ngay) return; if(!g[r.ngay]){ g[r.ngay]={lo:[],kl:0}; order.push(r.ngay); }
    g[r.ngay].lo.push(r.lo_so||r.ma_lo); g[r.ngay].kl+=n(r.kl_xuat); });
  return order.sort().map(d=>{ const nl=addDay(d,-1), ph=PHIEU.filter(p=>p.ngay===nl);
    const by=name=>ph.filter(p=>p.doi===name).reduce((s,p)=>s+n(p.kl_tuoi),0);
    const a=by(DOI[0]),b=by(DOI[1]),c=by(DOI[2]),e=by(DOI[3]);
    return {ngay_nk:d,lo:g[d].lo.join(', '),kl_xuat:String(g[d].kl),ngay_nl:nl,so_phieu:String(ph.length),ia_glai:String(a),ia_hlop:String(b),ia_ko:String(c),ia_tiem:String(e),tong_nl:String(a+b+c+e)}; });
}
function vungDefault(){
  const tot={}; truyNguoc().forEach(r=>{ [['Đội Ia Glai','ia_glai'],['Đội Ia Hlốp','ia_hlop'],['Đội Ia Ko','ia_ko'],['Đội Ia Tiêm','ia_tiem']].forEach(([d,k])=>{ tot[d]=(tot[d]||0)+n(r[k]); }); });
  return DOI.filter(d=>tot[d]>0).map(d=>({doi:d,tinh:'Gia Lai',loai:'Cao su (Hevea brasiliensis)',kl_nl:String(tot[d]),dt:DT_VUNG[d]||'',toado:'Polygon từ AppSheet / bảng Lô vườn'}));
}

   ============================================================ */
function fieldKind(f){
  if(f.type!=='ro') return {cls:'fk-fill', tag:'<span class="fk-tag t-fill">✎ Điền</span>'};
  if(f.inh) return {cls:'fk-inh', tag:'<span class="fk-tag t-inh">↩ Kế thừa'+(f.inhLbl?' · '+esc(f.inhLbl):'')+'</span>'};
  return {cls:'fk-auto', tag:'<span class="fk-tag t-auto">⚙ Tự tính</span>'};
}
function fieldHTML(f,d){
  let v = d[f.id]!==undefined && d[f.id]!=='' ? d[f.id] : '';
  if(f.type==='ro' && f.get){ v=f.get(); }
  else if(v==='' && f.get){ v=f.get(); }
  if(v==='' && f.dflt!==undefined) v=f.dflt;
  const kind=fieldKind(f);
  const cls='fgrp'+(f.full?' full':'')+' '+kind.cls;
  const lab='<label class="'+(f.req?'req':'')+'">'+esc(f.label)+kind.tag+'</label>';
  const hint=f.hint?'<div class="fhint">'+f.hint+'</div>':'';
  let inp='';
  if(f.type==='sel'){
    if(f.opts.indexOf(v)<0) v=(f.dflt!==undefined&&f.opts.indexOf(f.dflt)>=0)? f.dflt : f.opts[0];
    inp='<select id="'+f.id+'">'+f.opts.map(o=>'<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  } else if(f.type==='area'){ inp='<textarea id="'+f.id+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';
  } else if(f.type==='ro'){ inp='<input id="'+f.id+'" value="'+esc(v)+'" readonly/>';
  } else if(f.type==='num'){ inp='<input id="'+f.id+'" type="number" step="any" value="'+esc(v)+'" placeholder="0"/>';
  } else if(f.type==='date'){ inp='<input id="'+f.id+'" type="date" value="'+esc(v)+'"/>';
  } else { inp='<input id="'+f.id+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'"/>'; }
  return '<div class="'+cls+'">'+lab+inp+hint+'</div>';
}
function cellHTML(c,row){
  const v=row[c.k]!==undefined?row[c.k]:'';
  if(c.pick){
    const list=poolOf(c.pick), k=POOL_KEY[c.pick];
    let opts='<option value="">— chọn —</option>';
    if(v && !list.some(r=>r[k]===v)) opts+='<option selected>'+esc(v)+'</option>';
    opts+=list.map(r=>'<option'+(r[k]===v?' selected':'')+'>'+esc(r[k])+'</option>').join('');
    return '<select data-k="'+c.k+'" class="pick" onchange="pickRow(this,\''+c.pick+'\')">'+opts+'</select>';
  }
  if(c.type==='sel' && c.ro) return '<input data-k="'+c.k+'" value="'+esc(v)+'" readonly/>';
  if(c.type==='sel') return '<select data-k="'+c.k+'">'+[''].concat(c.opts).map(o=>'<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  if(c.type==='num') return '<input type="number" step="any" data-k="'+c.k+'" value="'+esc(v)+'" class="num-right"'+(c.ro?' readonly':'')+' oninput="recalc()" onchange="recalc()"/>';
  if(c.type==='date') return '<input type="date" data-k="'+c.k+'" value="'+esc(v)+'"'+(c.ro?' readonly':'')+'/>';
  return '<input data-k="'+c.k+'" value="'+esc(v)+'"'+(c.ro?' readonly':'')+' oninput="recalc()"/>';
}
function rowHTML(t,row){
  return '<tr>'+t.cols.map(c=>'<td'+(c.w?' style="width:'+c.w+'"':'')+'>'+cellHTML(c,row)+'</td>').join('')
    +'<td style="width:26px"><button class="tdel" onclick="this.closest(\'tr\').remove();recalc()">×</button></td></tr>';
}
function thKind(c){
  if(c.pick) return '<span class="th-k th-fill">✎ Chọn</span>';
  if(c.ro) return c.auto? '<span class="th-k th-auto">⚙ Tự tính</span>' : '<span class="th-k th-inh">↩ Kế thừa</span>';
  return '<span class="th-k th-fill">✎ Điền</span>';
}
function tableRows(t,d){
  let rows=d[t.id];
  if(rows===undefined) rows = t.derive? t.derive() : (t.def||[]);
  return rows;
}
function tableHTML(t,d){
  const rows=tableRows(t,d);
  let foot='';
  if(t.foot){
    foot='<tfoot><tr>'+t.cols.map(c=>{
      const f=t.foot.find(x=>x.k===c.k);
      if(!f) return '<td class="tf"></td>';
      if(f.lbl) return '<td class="tf tf-lbl">'+esc(f.lbl)+'</td>';
      return '<td class="tf'+(c.type==='num'?' num-right':'')+' tv-'+(f.c||'blue')+'">'+(f.pre?'<span style="font-size:10px;font-weight:500;color:var(--g500)">'+esc(f.pre)+'</span>':'')+'<span id="'+f.id+'">—</span></td>';
    }).join('')+'<td class="tf"></td></tr></tfoot>';
  }
  return '<div class="tw"><table><thead><tr>'+t.cols.map(c=>'<th'+(c.w?' style="width:'+c.w+'"':'')+'>'+esc(c.l)+thKind(c)+'</th>').join('')
    +'<th style="width:26px"></th></tr></thead><tbody id="tb-'+t.id+'">'+rows.map(r=>rowHTML(t,r)).join('')+'</tbody>'+foot+'</table></div>'
    +'<button class="tadd tadd-'+cf+'" onclick="addRow(\''+t.id+'\')">'+esc(t.add||'+ Thêm dòng')+'</button>';
}
function blockHTML(b,d){
  if(b.co) return '<div class="callout co-'+b.co+'"><span class="co-t">'+b.t+'</span>'+b.x+'</div>';
  if(b.btn) return '<div class="btn-line"><button class="btn" onclick="'+b.btn.fn+'">'+b.btn.label+'</button></div>';
  let h='<div class="fs">';
  if(b.title) h+='<div class="stitle st'+cf+'">'+esc(b.title)+'</div>';
  if(b.fields) h+='<div class="fg">'+b.fields.map(f=>fieldHTML(f,d)).join('')+'</div>';
  if(b.table) h+=tableHTML(b.table,d);
  if(b.check) h+=b.check.map((c,i)=>'<div class="ck-row"><input type="checkbox" id="ck_'+i+'" '+(d['ck_'+i]?'checked':'')
      +' style="width:16px;height:16px;flex-shrink:0"/><label for="ck_'+i+'" style="font-size:13px;cursor:pointer">'+esc(c)+'</label></div>').join('');
  return h+'</div>';
}
function findTable(tid){ let t=null; FLOWS[cf].steps[cs[cf]].body.forEach(b=>{ if(b.table&&b.table.id===tid) t=b.table; }); return t; }
function addRow(tid){ const t=findTable(tid); if(!t) return; document.getElementById('tb-'+tid).insertAdjacentHTML('beforeend',rowHTML(t,{})); recalc(); }
function resetTable(tid){ const t=findTable(tid); if(!t) return; const rows=t.derive? t.derive() : (t.def||[]);
  document.getElementById('tb-'+tid).innerHTML=rows.map(r=>rowHTML(t,r)).join(''); recalc(); }
function readTable(tid){
  const tb=document.getElementById('tb-'+tid); if(!tb) return [];
  return Array.from(tb.rows).map(tr=>{ const o={}; tr.querySelectorAll('[data-k]').forEach(el=>{ o[el.dataset.k]=el.value; }); return o; });
}
function pickRow(el,pool){
  const list=poolOf(pool), k=POOL_KEY[pool], rec=list.find(r=>r[k]===el.value), tr=el.closest('tr');
  tr.querySelectorAll('[data-k]').forEach(c=>{ if(c===el) return; const key=c.dataset.k;
    if(rec && rec[key]!==undefined) c.value=rec[key]; else if(!rec) c.value=''; });
  recalc();
}

    +'<div class="ibar-item"><div class="ilbl">Thời điểm / SLA</div><div class="ival">'+esc(step.sla)+'</div></div>'
    +'<div class="ibar-item"><div class="ilbl">Người duyệt</div><div class="ival">'+esc(step.duyet)+'</div></div></div>'
    +'<div class="fk-legend"><span><span class="fk-tag t-fill" style="margin:0">✎ Điền</span> người dùng nhập</span><span><span class="fk-tag t-inh" style="margin:0">↩ Kế thừa</span> lấy từ bước/bảng trước, không sửa</span><span><span class="fk-tag t-auto" style="margin:0">⚙ Tự tính</span> n8n / hệ thống tính</span></div>'
    +'<div class="fb">'+step.body.map(b=>blockHTML(b,d)).join('')+'</div>'
    +'<div class="navr"><span class="navc">Bước '+(c+1)+'/'+fl.steps.length+' · '+esc(fl.label)+'</span><div class="navb">'
    +(c>0?'<button class="btn" onclick="prevStep()">← Bước trước</button>':'')
    +'<button class="btn btn-ok" onclick="markDone()">✓ Đánh dấu hoàn thành</button>'
    +(!last?'<button class="btn btn-p'+cf+'" onclick="nextStep()">Lưu & tiếp →</button>':'<button class="btn btn-p'+cf+'" onclick="nextFlow()">Sang quy trình sau →</button>')
    +'</div></div>';
  recalc();
}
function renderAll(){ renderHeader(); renderTabs(); renderNav(); renderCard(); }
function goFlow(i){ saveForm(); cf=i; save(); renderAll(); scrollTo(0,0); }
function goStep(i){ saveForm(); cs[cf]=i; save(); renderNav(); renderCard(); scrollTo(0,0); }
function nextStep(){ saveForm(); if(cs[cf]<FLOWS[cf].steps.length-1){cs[cf]++;save();renderNav();renderCard();scrollTo(0,0);} }
function prevStep(){ saveForm(); if(cs[cf]>0){cs[cf]--;save();renderNav();renderCard();scrollTo(0,0);} }
function nextFlow(){ saveForm(); if(cf<FLOWS.length-1){ cf++; save(); renderAll(); scrollTo(0,0);} else { goOverview(); } }
function markDone(){ saveForm(); if(!state[key()]) state[key()]={}; state[key()].done=true; save(); renderNav(); }
function saveForm(){
  if(cf<0) return;
  const d={};
  document.querySelectorAll('#sc input[id], #sc select[id], #sc textarea[id]').forEach(el=>{ d[el.id]= el.type==='checkbox'? el.checked : el.value; });
  FLOWS[cf].steps[cs[cf]].body.forEach(b=>{ if(b.table) d[b.table.id]=readTable(b.table.id); });
  state[key()]=Object.assign({},state[key()]||{},d); save();
}

/* ============================================================
   TÍNH TOÁN
   ============================================================ */
function recalc(){
  if(cf<0) return;
  FLOWS[cf].steps[cs[cf]].body.forEach(b=>{
    if(!b.table||!b.table.foot) return;
    const rows=readTable(b.table.id);
    b.table.foot.forEach(f=>{ if(!f.id) return;
      if(f.cnt){ setM(f.id,String(rows.length)); }
      else if((b.table.sumCols||[]).indexOf(f.k)>=0){ let s=0; rows.forEach(r=>s+=n(r[f.k])); setM(f.id,fmt(s)); }
    });
  });
  const k=cf+'_'+cs[cf];
  if(k==='0_1') calcTN2();
  if(k==='3_1') calcXH2();
}
function calcTN2(){ const rows=readTable('tn2_list'); setRO('tn2_n',String(rows.length)); setRO('tn2_kl',fmt(rows.reduce((s,r)=>s+n(r.kl_tuoi),0))); }
function calcXH2(){
  const rows=readTable('xh2_list'); let ton=0,chon=0; rows.forEach(r=>{ ton+=n(r.kl_ton); chon+=n(r.kl_xuat); });
  const e=document.getElementById('xh2_can'), can=n(e&&e.value);
  setM('xh2_m_ton',fmt(ton)); setM('xh2_m_chon',fmt(chon));
  const d=can-chon; setM('xh2_m_thieu', can? (d>0? '−'+fmt(d) : (d<0? '+'+fmt(-d) : '0 (khớp)')) : '—');
}

/* ============================================================
   TỔNG QUAN
   ============================================================ */
function chainSVG(){
  const box=(x,label,code,color)=>'<g><rect x="'+x+'" y="26" width="126" height="52" rx="9" fill="'+color+'14" stroke="'+color+'" stroke-width="1"/><text x="'+(x+63)+'" y="46" text-anchor="middle" font-size="12" font-weight="700" fill="'+color+'" font-family="Be Vietnam Pro,sans-serif">'+code+'</text><text x="'+(x+63)+'" y="65" text-anchor="middle" font-size="9" fill="#374151" font-family="Be Vietnam Pro,sans-serif">'+label+'</text></g>';
  const arrow=x=>'<line x1="'+x+'" y1="52" x2="'+(x+16)+'" y2="52" stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#ch-a)"/>';
  return '<div style="overflow-x:auto;margin:6px 0 16px"><svg width="100%" viewBox="0 0 760 110" style="min-width:680px"><defs><marker id="ch-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#9CA3AF" stroke-width="1.5" stroke-linecap="round"/></marker></defs>'
   +'<text x="8" y="16" font-size="10" fill="#9CA3AF" font-family="Be Vietnam Pro,sans-serif">Truy ngược: Lô hàng xuất → Lô thành phẩm → Thùng/Mương/Hồ → Phiếu giao nhận/Đội</text>'
   +box(8,'Đội (Ia Glai…)','Phiếu giao nhận','#2E6B34')+arrow(134)+box(150,'Tiếp nhận · QT1','Hồ hỗn hợp','#185FA5')+arrow(276)
   +box(292,'Chế biến · QT2','Mương→Thùng→Lô','#1A7A5E')+arrow(418)+box(434,'Nhập kho · QT3','Kho TP','#7B2FA0')+arrow(560)+box(576,'Xuất hàng · DDS · QT4','Xuất/DDS','#C25B10')+'</svg></div>';
}
function goOverview(){
  saveForm(); cf=-1; save(); renderTabs();
  const total=FLOWS.reduce((s,f)=>s+f.steps.length,0);
  document.getElementById('hdr-wrap').innerHTML='<div class="hdr" style="background:linear-gradient(135deg,#1a1a2e,#16213e)"><div class="hdr-badge">Truy xuất nguồn gốc cao su · PEFC CoC EUDR</div><h1>Cao su Chư Sê (Gia Lai) — Luồng truy xuất từ sổ giấy sang Base</h1><p>4 nhóm Service · '+total+' bước · Đứng trên Base Table + n8n — lọc khi phải chọn dữ liệu, chế biến chạy liền mạch</p></div>';
  document.getElementById('step-nav').innerHTML='';
  const card=i=>{ const fl=FLOWS[i], c=['#185FA5','#1A7A5E','#7B2FA0','#C25B10'][i];
    return '<div onclick="goFlow('+i+')" style="cursor:pointer;border:1px solid '+c+';border-left:4px solid '+c+';border-radius:10px;padding:14px 16px;margin-bottom:10px;background:'+c+'0A"><div style="font-size:14px;font-weight:600;color:'+c+';margin-bottom:3px">'+esc(fl.label)+'</div><div style="font-size:12px;color:var(--g500);margin-bottom:8px">'+esc(fl.sub)+'</div><div style="display:flex;gap:6px;flex-wrap:wrap">'
    +fl.steps.map((s,j)=>{ const dn=(state[i+'_'+j]||{}).done; return '<span style="font-size:11px;padding:2px 9px;border-radius:12px;background:'+(dn?'#EAF3DE':'#fff')+';border:1px solid '+(dn?'#3B6D11':'#D1D5DB')+';color:'+(dn?'#3B6D11':'#6B7280')+'">'+esc(s.code)+' '+esc(s.title)+'</span>'; }).join('')+'</div></div>'; };
  const row=r=>'<tr><td style="font-weight:600;font-size:12.5px">'+r[0]+'</td><td style="font-family:ui-monospace,monospace;font-size:12px;color:var(--blue)">'+r[1]+'</td><td style="font-size:12.5px;color:var(--g700)">'+r[2]+'</td></tr>';
  document.getElementById('sc').innerHTML='<div style="padding:22px">'
   +'<div class="stitle st0" style="color:var(--g700);border-color:var(--g200)">Chuỗi truy xuất — xương sống hệ thống</div>'+chainSVG()
   +'<div class="callout co-info"><span class="co-t">Khi nào có bước Lọc, khi nào không</span>Chỉ đặt bước <b>Lọc</b> ở chỗ phải chọn dữ liệu từ nhiều ngày / nhiều nguồn: chọn phiếu giao nhận (QT1), chọn lô nhập kho (QT3), chọn lô xuất (QT4) — bảng trả về luôn nằm <b>sau</b> bước lọc. Khâu <b>chế biến (QT2)</b> chạy liền một mạch do một người nhập, khâu sau kế thừa thẳng hồ → mương → thùng của khâu trước nên không có bước lọc. Mỗi trường gắn nhãn <span class="fk-tag t-fill" style="margin:0">✎ Điền</span> <span class="fk-tag t-inh" style="margin:0">↩ Kế thừa</span> <span class="fk-tag t-auto" style="margin:0">⚙ Tự tính</span>.</div>'
   +'<div class="callout co-warn"><span class="co-t">Kiến trúc thật: Base Table + n8n — demo chỉ mô phỏng trải nghiệm nhập liệu</span>Mỗi khối trong sơ đồ là một <b>Base Table</b>; các Service là giao diện nhập liệu từng bảng. Sinh mã, gom nhóm, nối liên kết, cân đối khối lượng do <b>n8n</b> chạy ngầm — các hàm kế thừa trong file này chỉ để hiển thị "nếu n8n đã đồng bộ xong thì Service sẽ thấy gì".</div>'
   +'<div class="stitle st0" style="color:var(--g700);border-color:var(--g200);margin-top:18px">Base Table &amp; n8n workflow tương ứng</div>'
   +'<div class="tw"><table><thead><tr><th style="width:190px">Base Table</th><th style="width:170px">Mã khoá</th><th>n8n workflow xử lý</th></tr></thead><tbody>'
   +[['Phiếu giao nhận','Mã phiếu (GN-ddmm-xx)','Bảng nguồn — TN-1/TN-2 lọc & chọn trực tiếp trên bảng này'],
     ['Hồ hỗn hợp','Ngày · Hồ…/100p','WF1: gom phiếu theo hồ → số phiếu, KL tươi; DRC/quy khô lấy từ sổ'],
     ['Mương · Thùng','Mương số · Thùng số','WF2: nối Hồ → Mương → Thùng, giữ thùng xuyên suốt tạo hạt → nhiệt → ép kiện'],
     ['Lô thành phẩm','TP-ddmm-xx','WF3: sinh mã lô khi ép kiện xong, đẩy sang bảng Nhập kho; cảnh báo lô thiếu số'],
     ['Nhập kho thành phẩm','Phiếu NK / Lô','WF3 (tiếp): đối chiếu lô ↔ khu lưu trữ, tổng hợp phiếu theo loại mủ'],
     
     ['Đơn hàng / Lệnh xuất / Lô xuất','Số lệnh XH','WF4: giữ lô xuất cho đơn, kiểm tra KL xuất khớp số lượng lệnh; trừ tồn khi duyệt'],
     ['DDS · Trang truy xuất','Order / Số DDS','WF5: truy ngược lô xuất (lô ngày D ← NL ngày D-1) → Đội, vùng trồng, polygon; dựng DDS và link/QR cho khách']].map(row).join('')+'</tbody></table></div>'
   +'<div class="stitle st0" style="color:var(--g700);border-color:var(--g200);margin-top:18px">4 nhóm Service — bấm để xem giao diện nhập liệu</div>'+FLOWS.map((_,i)=>card(i)).join('')
   +'<div class="stitle st0" style="color:var(--g700);border-color:var(--g200);margin-top:18px">Biểu mẫu nguồn</div>'
   +'<div class="tw"><table><thead><tr><th style="width:70px">QT</th><th style="width:240px">Biểu mẫu</th><th>Nội dung</th></tr></thead><tbody>'
   +[['QT1','BM 02B-QLCL-TCCS','Sổ theo dõi tiếp nhận nguyên liệu mủ nước'],
     ['QT2','BM 03 · 06B · 07A · 08A-QLCL-TCCS','Đánh đông → Tạo hạt → Gia công nhiệt → Ra lò, ép kiện, đóng gói'],
     ['QT3','BM 09-QLCL-TCCS + BM 03/CBCS-QT8.0','Sổ theo dõi nhập kho + Phiếu nhập kho thành phẩm'],
     ['QT4','Lệnh XH · Thông báo · Chứng chỉ (đính kèm) · B07a.QT DDS-01','Lệnh xuất & chọn lô; DDS tự sinh từ chuỗi; lệnh SX, KHSX, thông báo, chứng chỉ chỉ là chứng từ đính kèm']].map(row).join('')+'</tbody></table></div>'
   +'<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn" onclick="window.print()">🖨 In toàn bộ</button><button class="btn" onclick="resetAll()">↺ Xoá dữ liệu nhập thử</button></div></div>';
  scrollTo(0,0);
}
function resetAll(){ if(!confirm('Xoá toàn bộ dữ liệu đã nhập thử trong trình duyệt?')) return; state={}; try{ sessionStorage.clear(); sessionStorage.setItem('cs_ver',STORE_VER); }catch(e){} cs=FLOWS.map(()=>0); save(); goOverview(); }

/* BOOT */
if(cf>=FLOWS.length) cf=-1;
FLOWS.forEach((fl,i)=>{ if(!cs[i]||cs[i]>=fl.steps.length) cs[i]=0; });
if(cf<0){ goOverview(); } else { renderAll(); }

</script>
