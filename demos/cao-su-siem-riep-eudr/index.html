<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Quy trình truy xuất nguồn gốc — Cao su Tây Ninh Siêm Riệp</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&display=swap');
:root{
  --blue:#185FA5;--blue-dark:#0F3460;--blue-light:#E6F1FB;--blue-xl:#F0F6FD;
  --teal:#1A7A5E;--teal-dark:#0A4D3C;--teal-light:#E1F5EE;--teal-xl:#F0FAF6;
  --purple:#7B2FA0;--purple-dark:#3D1C72;--purple-light:#F0E8FA;--purple-xl:#F8F4FD;
  --orange:#C25B10;--orange-dark:#7A3208;--orange-light:#FDE8D8;--orange-xl:#FEF4EE;
  --rose:#8B2252;--rose-dark:#5C1538;--rose-light:#F9E0EC;--rose-xl:#FDF3F8;
  --indigo:#2F4B9B;--indigo-dark:#1B2C63;--indigo-light:#E4EAF8;--indigo-xl:#F2F5FC;
  --amber:#854F0B;--amber-light:#FAEEDA;
  --green:#3B6D11;--green-light:#EAF3DE;
  --red:#A32D2D;--red-light:#FEE8E8;
  --g50:#F9FAFB;--g100:#F3F4F6;--g200:#E5E7EB;--g300:#D1D5DB;
  --g400:#9CA3AF;--g500:#6B7280;--g700:#374151;--g900:#111827;
  --w:#fff;--r:8px;--sh:0 1px 4px rgba(0,0,0,.08);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Be Vietnam Pro',system-ui,sans-serif;background:var(--g100);color:var(--g900);font-size:14px}

.hdr{padding:26px 36px;color:#fff}
.hdr-0{background:linear-gradient(135deg,var(--blue-dark),var(--blue))}
.hdr-1{background:linear-gradient(135deg,var(--teal-dark),var(--teal))}
.hdr-2{background:linear-gradient(135deg,var(--purple-dark),var(--purple))}
.hdr-3{background:linear-gradient(135deg,var(--orange-dark),var(--orange))}
.hdr-4{background:linear-gradient(135deg,var(--rose-dark),var(--rose))}
.hdr-5{background:linear-gradient(135deg,var(--indigo-dark),var(--indigo))}
.hdr-badge{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;display:inline-block;margin-bottom:10px}
.hdr h1{font-size:21px;font-weight:700;margin-bottom:4px}
.hdr p{font-size:13px;opacity:.75}

.flow-tabs{background:var(--w);border-bottom:1px solid var(--g200);display:flex;overflow-x:auto}
.ftab{padding:13px 20px;font-size:13px;font-weight:500;color:var(--g500);cursor:pointer;border:none;background:none;border-bottom:2.5px solid transparent;white-space:nowrap;font-family:inherit;transition:all .15s}
.ftab:hover{color:var(--g700)}
.ftab.fa0{color:var(--blue);border-bottom-color:var(--blue)}
.ftab.fa1{color:var(--teal);border-bottom-color:var(--teal)}
.ftab.fa2{color:var(--purple);border-bottom-color:var(--purple)}
.ftab.fa3{color:var(--orange);border-bottom-color:var(--orange)}
.ftab.fa4{color:var(--rose);border-bottom-color:var(--rose)}
.ftab.fa5{color:var(--indigo);border-bottom-color:var(--indigo)}

th/* phân loại trường */
.fk-tag{display:inline-block;border-radius:9px;padding:0 7px;font-size:9.5px;font-weight:700;margin-left:6px;vertical-align:middle;letter-spacing:.02em;text-transform:none}
.t-fill{background:#FDE8D8;color:#7A3208;border:1px solid #C25B10}
.t-inh{background:var(--teal-light);color:var(--teal);border:1px solid var(--teal)}
.t-auto{background:var(--g200);color:var(--g500);border:1px solid var(--g400)}
.t-app{background:var(--purple-light);color:var(--purple);border:1px solid var(--purple)}
.fk-fill input,.fk-fill select,.fk-fill textarea,.fk-fill .mdd-btn{background:var(--w);border-color:#E3B892}
.fk-fill input:hover,.fk-fill select:hover,.fk-fill textarea:hover{border-color:var(--orange)}
.fk-legend{display:flex;flex-wrap:wrap;gap:14px;padding:8px 22px;border-bottom:1px solid var(--g200);background:var(--g50);font-size:11px;color:var(--g500)}
.mdd{position:relative}
.mdd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 11px;border:1px solid var(--g300);border-radius:var(--r);background:var(--g50);font-family:inherit;font-size:13px;color:var(--g900);cursor:pointer;text-align:left;text-transform:none;letter-spacing:0}
.mdd-btn:hover{background:var(--w)}
.mdd-ar{color:var(--g400);font-size:11px}
.mdd-panel{display:none;position:absolute;z-index:60;top:calc(100% + 4px);left:0;right:0;background:var(--w);border:1px solid var(--g300);border-radius:var(--r);box-shadow:0 6px 18px rgba(0,0,0,.12);padding:5px;max-height:220px;overflow:auto}
.mdd-panel.open{display:block}
.mdd-opt{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:6px;font-size:12.5px;color:var(--g700);cursor:pointer;text-transform:none;letter-spacing:0;font-weight:500}
.mdd-opt:hover{background:var(--g100)}
.mdd-opt.on{background:var(--teal-light);color:var(--teal-dark)}
.mdd-opt input{width:15px;height:15px;margin:0}
.inh-tag{display:inline-block;background:var(--teal-light);color:var(--teal);border-radius:9px;padding:0 7px;font-size:10px;font-weight:600;margin-right:4px}
.step-nav{background:var(--w);border-bottom:1px solid var(--g200);position:sticky;top:env(safe-area-inset-top,0px);z-index:100;overflow-x:auto}
.snav-inner{display:flex;align-items:center;padding:10px 28px;min-width:max-content}
.snav-item{display:flex;align-items:center;cursor:pointer}
.snav-dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--g300);background:var(--w);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--g400);flex-shrink:0;transition:all .2s}
.snav-label{font-size:10px;color:var(--g500);font-weight:500;margin-left:6px;margin-right:2px;max-width:92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snav-line{width:16px;height:2px;background:var(--g200);flex-shrink:0}
.s0 .snav-item.sa .snav-dot{background:var(--blue);border-color:var(--blue);color:#fff}
.s1 .snav-item.sa .snav-dot{background:var(--teal);border-color:var(--teal);color:#fff}
.s2 .snav-item.sa .snav-dot{background:var(--purple);border-color:var(--purple);color:#fff}
.s3 .snav-item.sa .snav-dot{background:var(--orange);border-color:var(--orange);color:#fff}
.s4 .snav-item.sa .snav-dot{background:var(--rose);border-color:var(--rose);color:#fff}
.s5 .snav-item.sa .snav-dot{background:var(--indigo);border-color:var(--indigo);color:#fff}
.snav-item.sd .snav-dot{background:var(--green-light);border-color:var(--green);color:var(--green)}
.snav-item.sd .snav-line{background:var(--green)}

.main{max-width:1000px;margin:26px auto;padding:0 18px 60px}
.sc{background:var(--w);border:1px solid var(--g200);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
.sc-hdr{padding:17px 22px;border-bottom:1px solid var(--g200);display:flex;align-items:center;gap:12px}
.sc-hdr-0{background:var(--blue-xl)}.sc-hdr-1{background:var(--teal-xl)}.sc-hdr-2{background:var(--purple-xl)}
.sc-hdr-3{background:var(--orange-xl)}.sc-hdr-4{background:var(--rose-xl)}
.sc-hdr-5{background:var(--indigo-xl)}
.sc-badge{min-width:34px;height:34px;border-radius:50%;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.sb0{background:var(--blue)}.sb1{background:var(--teal)}.sb2{background:var(--purple)}
.sb3{background:var(--orange)}.sb4{background:var(--rose)}
.sb5{background:var(--indigo)}
.sc-title{font-size:15px;font-weight:600;margin-bottom:2px}
.sc-title-0{color:var(--blue-dark)}.sc-title-1{color:var(--teal-dark)}.sc-title-2{color:var(--purple-dark)}
.sc-title-3{color:var(--orange-dark)}.sc-title-4{color:var(--rose-dark)}
.sc-title-5{color:var(--indigo-dark)}
.sc-desc{font-size:12px;color:var(--g500)}

.ibar{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--g200)}
.ibar-item{padding:9px 16px;border-right:1px solid var(--g200)}
.ibar-item:last-child{border-right:none}
.ilbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--g400);margin-bottom:2px}
.ival{font-size:12px;color:var(--g700);font-weight:500}
.role-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.rb0{background:var(--blue-light);color:var(--blue)}.rb1{background:var(--teal-light);color:var(--teal)}
.rb2{background:var(--purple-light);color:var(--purple)}.rb3{background:var(--orange-light);color:var(--orange)}
.rb4{background:var(--rose-light);color:var(--rose)}
.rb5{background:var(--indigo-light);color:var(--indigo)}

.fb{padding:20px 22px}
.fs{margin-bottom:22px}
.fs:last-child{margin-bottom:0}
.stitle{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px;padding-bottom:5px;border-bottom:2px solid}
.st0{color:var(--blue);border-color:var(--blue-light)}.st1{color:var(--teal);border-color:var(--teal-light)}
.st2{color:var(--purple);border-color:var(--purple-light)}.st3{color:var(--orange);border-color:var(--orange-light)}
.st4{color:var(--rose);border-color:var(--rose-light)}
.st5{color:var(--indigo);border-color:var(--indigo-light)}
.fg{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.fg3{grid-template-columns:1fr 1fr 1fr}
.fgrp.full{grid-column:1/-1}
.fgrp label{display:block;font-size:10px;font-weight:600;color:var(--g500);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.fgrp input,.fgrp textarea,.fgrp select{width:100%;padding:7px 11px;border:1px solid var(--g300);border-radius:var(--r);font-family:inherit;font-size:13px;color:var(--g900);background:var(--g50);transition:border .15s;resize:vertical}
.fgrp input:focus,.fgrp textarea:focus,.fgrp select:focus{outline:none;border-color:var(--blue);background:var(--w);box-shadow:0 0 0 2px rgba(24,95,165,.08)}
.fgrp textarea{min-height:64px}
.fgrp input[readonly]{background:var(--g100);color:var(--g700);font-weight:600}
.req::after{content:' *';color:var(--red)}
.fhint{font-size:10.5px;color:var(--g400);margin-top:3px;text-transform:none;letter-spacing:0;font-weight:400}

.tw{overflow-x:auto;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--g100);padding:7px 9px;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--g500);border:1px solid var(--g200);white-space:nowrap}
td{padding:4px 6px;border:1px solid var(--g200);vertical-align:middle}
td input,td select{width:100%;border:none;background:transparent;font-family:inherit;font-size:13px;color:var(--g900);padding:2px 4px;min-height:26px}
td input:focus,td select:focus{outline:1px solid var(--blue);border-radius:3px;background:var(--blue-xl)}
td select.pick{font-weight:600;color:var(--blue);background:var(--blue-xl);border-radius:4px}
td input[readonly],td select[disabled]{color:var(--g500);font-weight:600;background:var(--g50);cursor:default}
td input[readonly]:focus{outline:none;background:var(--g50)}
tfoot td{background:var(--g100);font-weight:600}
.tadd{margin-top:6px;font-size:12px;cursor:pointer;font-weight:500;background:none;border:1px dashed;border-radius:6px;padding:5px 12px;width:100%;font-family:inherit}
.tadd-0{color:var(--blue);border-color:var(--blue)}.tadd-1{color:var(--teal);border-color:var(--teal)}
.tadd-2{color:var(--purple);border-color:var(--purple)}.tadd-3{color:var(--orange);border-color:var(--orange)}
.tadd-4{color:var(--rose);border-color:var(--rose)}
.tadd-5{color:var(--indigo);border-color:var(--indigo)}
.tdel{background:none;border:none;color:var(--g400);cursor:pointer;font-size:15px;padding:0 4px}
.tdel:hover{color:var(--red)}

.callout{border-radius:8px;padding:11px 14px;font-size:12.5px;line-height:1.55;margin-bottom:14px}
.co-warn{background:var(--amber-light);border:1px solid var(--amber);color:#5c3706}
.co-info{background:var(--blue-light);border:1px solid var(--blue);color:var(--blue-dark)}
.co-auto{background:var(--teal-light);border:1px solid var(--teal);color:var(--teal-dark)}
.co-danger{background:var(--red-light);border:1px solid var(--red);color:#6d1d1d}
.co-t{font-weight:700;display:block;margin-bottom:2px}
.gia-dinh{display:inline-block;background:var(--amber-light);color:var(--amber);border:1px solid var(--amber);border-radius:10px;padding:1px 7px;font-size:10px;font-weight:700;margin-left:6px;vertical-align:middle}

.ck-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--g100)}
.tf{background:var(--g100);border-top:2px solid var(--g300);padding:6px 10px;font-size:13.5px;font-weight:700}
.tf-lbl{font-size:10.5px;letter-spacing:.06em;color:var(--g500);text-align:center}
.tf-pre{font-size:10px;font-weight:500;color:var(--g500);margin-right:3px}
.tv-blue{color:var(--blue)}.tv-teal{color:var(--teal)}.tv-amber{color:var(--amber)}
.tv-green{color:var(--green)}.tv-red{color:var(--red)}
.totrow{margin-top:-1px}
.totrow table{border-collapse:collapse}
.totrow th{background:var(--g200)}
.tot-lbl{background:var(--g100);font-size:10.5px;font-weight:700;color:var(--g500);letter-spacing:.05em;text-align:center}
.tot-val{font-size:15px;font-weight:700;padding:8px 10px;background:var(--g50)}
.tv-blue{color:var(--blue)}.tv-teal{color:var(--teal)}.tv-amber{color:var(--amber)}
.tv-green{color:var(--green)}.tv-red{color:var(--red)}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.metric{border-radius:8px;padding:11px;text-align:center;border:1px solid}
.m-blue{background:var(--blue-light);border-color:var(--blue)}
.m-teal{background:var(--teal-light);border-color:var(--teal)}
.m-amber{background:var(--amber-light);border-color:var(--amber)}
.m-green{background:var(--green-light);border-color:var(--green)}
.m-red{background:var(--red-light);border-color:var(--red)}
.m-val{font-size:19px;font-weight:700;line-height:1.2}
.m-blue .m-val{color:var(--blue)}.m-teal .m-val{color:var(--teal)}.m-amber .m-val{color:var(--amber)}
.m-green .m-val{color:var(--green)}.m-red .m-val{color:var(--red)}
.m-lbl{font-size:10.5px;color:var(--g500);margin-top:3px}

.navr{display:flex;justify-content:space-between;align-items:center;padding:13px 22px;border-top:1px solid var(--g200);background:var(--g50);gap:10px;flex-wrap:wrap}
.navc{font-size:12px;color:var(--g500)}
.navb{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:7px 16px;border-radius:8px;border:1px solid var(--g300);background:var(--w);color:var(--g700);font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{background:var(--g100)}
.btn-p0{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-p1{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn-p2{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn-p3{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn-p4{background:var(--rose);color:#fff;border-color:var(--rose)}
.btn-p5{background:var(--indigo);color:#fff;border-color:var(--indigo)}
.btn-ok{background:var(--green-light);color:var(--green);border-color:var(--green)}
.num-right{text-align:right}
@media print{.flow-tabs,.step-nav,.navr,.tadd,.tdel{display:none!important}.main{margin:0;max-width:100%}.sc{box-shadow:none}body{background:#fff}}
@media(max-width:700px){
  .fg,.fg3,.ibar,.metric-grid{grid-template-columns:1fr}
  .ibar-item{border-right:none;border-bottom:1px solid var(--g200)}
  .main{padding:0 10px 40px}.hdr{padding:18px}.snav-label{display:none}
  .metric-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

function ss(k,v){ try{ if(v===undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k,v);}catch(e){return null} }
// Dọn dữ liệu nhập thử của bản cũ (cấu trúc bảng đã đổi)
const STORE_VER='v56';
try{ if(sessionStorage.getItem('cs_ver')!==STORE_VER){ sessionStorage.clear(); sessionStorage.setItem('cs_ver',STORE_VER); } }catch(e){}


let cf = parseInt(ss('cs_cf')||'-1');
let cs = FLOWS.map((_,i)=>parseInt(ss('cs_s'+i)||'0'));
let state = {};
try{ state = JSON.parse(ss('cs_state')||'{}'); }catch(e){ state={}; }

function save(){ ss('cs_cf',cf); cs.forEach((v,i)=>ss('cs_s'+i,v)); try{ ss('cs_state',JSON.stringify(state)); }catch(e){} }
function inMode(o){ return true; }
function colsOf(t){ return t.cols.filter(inMode); }
function key(){ return cf+'_'+cs[cf]; }
function D(){ return state[key()]||{}; }

/* ============================================================
   HELPERS
   ============================================================ */
function esc(v){ return (v===undefined||v===null?'':String(v)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function n(v){
  let t=String(v==null?'':v).trim().replace(/[^0-9.,\-]/g,'');
  if(t.indexOf(',')>=0) t=t.replace(/\./g,'').replace(',','.');        // 41.310,5 -> 41310.5
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(t)) t=t.replace(/\./g,'');     // 41.310 -> 41310
  const x=parseFloat(t); return isNaN(x)?0:x;
}
function fmt(x){ return (Math.round(x*100)/100).toLocaleString('vi-VN'); }
function setM(id,val,sub){ const e=document.getElementById(id); if(e) e.innerHTML=val+(sub?'<span style="font-size:11px;font-weight:500"> '+sub+'</span>':''); }

/* ============================================================
   RENDER — FIELD / TABLE / SECTION
   ============================================================ */
function toggleMdd(id){
  const pan=document.getElementById('mddpan_'+id); if(!pan) return;
  const open=pan.classList.toggle('open');
  document.querySelectorAll('.mdd-panel.open').forEach(function(p){ if(p!==pan) p.classList.remove('open'); });
  if(open){ setTimeout(function(){
    document.addEventListener('click', function close(e){
      if(!e.target.closest('#mdd_'+id)){ pan.classList.remove('open'); document.removeEventListener('click',close); }
    });
  },0); }
}

function syncMulti(el,id){
  el.closest('.mdd-opt').classList.toggle('on',el.checked);
  const box=el.closest('.mdd-panel');
  const vals=Array.from(box.querySelectorAll('input[type=checkbox]')).filter(function(c){return c.checked;}).map(function(c){return c.dataset.v;});
  const h=document.getElementById(id); if(h) h.value=vals.join(' · ');
  const lb=document.getElementById('mddlbl_'+id);
  if(lb) lb.textContent = vals.length? (vals.length===1? vals[0] : vals.length+' ô đã chọn') : '— chọn ô —';
  recalc();
}

// phân loại trường: điền tay · kế thừa · tự tính · đồng bộ app
function fieldKind(f){
  if(f.src==='app') return {cls:'fk-app', tag:'<span class="fk-tag t-app">⇄ App Nghĩa</span>'};
  // sửa được thì vẫn là trường điền, dù có giá trị mặc định kế thừa
  if(f.type!=='ro') return {cls:'fk-fill', tag:'<span class="fk-tag t-fill">✎ Điền</span>'};
  if(f.inh || f.src==='inh') return {cls:'fk-inh', tag:'<span class="fk-tag t-inh">↩ Kế thừa</span>'};
  return {cls:'fk-auto',tag:'<span class="fk-tag t-auto">⚙ Tự tính</span>'};
}

function inhVal(f){ if(!f.inh) return ''; const s=state[f.inh[0]]||{}; const v=s[f.inh[1]]; return (v===undefined||v===null)?'':v; }

function fieldHTML(f,d){
  let v = d[f.id]!==undefined && d[f.id]!=='' ? d[f.id] : '';
  let inherited=false;
  if(v==='' && f.inh){ const iv=inhVal(f); if(iv!==''){ v=iv; inherited=true; } }
  if(v==='' && f.dflt!==undefined) v=f.dflt;
  const kind = fieldKind(f);
  const cls = 'fgrp'+(f.full?' full':'')+' '+kind.cls;
  const lab = '<label class="'+(f.req?'req':'')+'">'+esc(f.label)+kind.tag+'</label>';
  const hint = f.hint?'<div class="fhint">'+f.hint+'</div>':'';
  const oi = f.calc?' oninput="recalc()" onchange="recalc()"':'';
  let inp='';
  if(f.type==='multi'){
    const cur=String(v||'').split(' · ').filter(Boolean);
    const lbl = cur.length? (cur.length===1? cur[0] : cur.length+' ô đã chọn') : '— chọn ô —';
    inp='<div class="mdd" id="mdd_'+f.id+'">'
      +'<button type="button" class="mdd-btn" onclick="toggleMdd(\''+f.id+'\')"><span id="mddlbl_'+f.id+'">'+esc(lbl)+'</span><span class="mdd-ar">▾</span></button>'
      +'<div class="mdd-panel" id="mddpan_'+f.id+'">'
      +f.opts.map(function(o){
        return '<label class="mdd-opt'+(cur.indexOf(o)>=0?' on':'')+'"><input type="checkbox" data-v="'+esc(o)+'" '+(cur.indexOf(o)>=0?'checked':'')
          +' onchange="syncMulti(this,\''+f.id+'\')"/>'+esc(o)+'</label>';
      }).join('')
      +'</div><input type="hidden" id="'+f.id+'" value="'+esc(v)+'"/></div>';
  } else if(f.type==='sel'){
    if(f.opts.indexOf(v)<0) v = (f.dflt!==undefined && f.opts.indexOf(f.dflt)>=0)? f.dflt : f.opts[0];
    inp='<select id="'+f.id+'"'+oi+'>'+f.opts.map(o=>'<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  } else if(f.type==='area'){
    inp='<textarea id="'+f.id+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';
  } else if(f.type==='file'){
    inp='<input id="'+f.id+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'Tên file / link chứng từ đính kèm…')+'"/>';
  } else if(f.type==='ro'){
    inp='<input id="'+f.id+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'" readonly/>';
  } else if(f.type==='num'){
    inp='<input id="'+f.id+'" type="number" step="any" value="'+esc(v)+'" placeholder="'+esc(f.ph||'0')+'"'+oi+'/>';
  } else if(f.type==='date'){
    inp='<input id="'+f.id+'" type="date" value="'+esc(v)+'"'+oi+'/>';
  } else {
    inp='<input id="'+f.id+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'"'+oi+'/>';
  }
  return '<div class="'+cls+'">'+lab+inp+hint+'</div>';
}

function cellHTML(c,row){
  const v = row[c.k]!==undefined?row[c.k]:'';
  const oi = c.calc?' oninput="recalc()" onchange="recalc()"':'';
  if(c.pick){
    let list=poolOf(c.pick); const k=POOL_KEY[c.pick];
    let opts='<option value="">— chọn —</option>';
    if(v && !list.some(function(r){return r[k]===v;})) opts+='<option selected>'+esc(v)+'</option>';
    opts+=list.map(function(r){return '<option'+(r[k]===v?' selected':'')+'>'+esc(r[k])+'</option>';}).join('');
    return '<select data-k="'+c.k+'" class="pick" onchange="pickRow(this,\''+c.pick+'\')">'+opts+'</select>';
  }
  if(c.type==='sel' && c.ro) return '<input data-k="'+c.k+'" value="'+esc(v)+'" readonly/>';
  if(c.type==='sel') return '<select data-k="'+c.k+'"'+oi+'>'+['']. concat(c.opts).map(o=>'<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
  if(c.type==='check') return '<div style="text-align:center"><input type="checkbox" data-k="'+c.k+'" '+(v===true||v==='true'?'checked':'')+' style="width:16px;height:16px"'+oi+'/></div>';
  if(c.type==='num') return '<input type="number" step="any" data-k="'+c.k+'" value="'+esc(v)+'" class="num-right"'+(c.ro?' readonly':'')+oi+'/>';
  if(c.type==='date') return '<input type="date" data-k="'+c.k+'" value="'+esc(v)+'"'+oi+'/>';
  return '<input data-k="'+c.k+'" value="'+esc(v)+'"'+(c.ro?' readonly':'')+oi+'/>';
}

function rowHTML(t,row){
  return '<tr>'+colsOf(t).map(c=>'<td'+(c.w?' style="width:'+c.w+'"':'')+'>'+cellHTML(c,row)+'</td>').join('')
    +'<td style="width:28px"><button class="tdel" onclick="this.closest(\'tr\').remove();recalc()">×</button></td></tr>';
}

function tableHTML(t,d){
  let rows = d[t.id]!==undefined ? d[t.id] : null;
  if(rows===null && t.inh){ const src=(state[t.inh[0]]||{})[t.inh[1]]; if(src && src.length) rows=src; }
  if(rows===null && t.defFn) rows = t.defFn();
  if(rows===null) rows = t.def||[];
  let foot='';
  if(t.foot){
    foot='<tfoot><tr>'+colsOf(t).map(c=>{
      const f=t.foot.find(x=>x.k===c.k);
      if(!f) return '<td class="tf"></td>';
      if(f.lbl) return '<td class="tf tf-lbl">'+esc(f.lbl)+'</td>';
      const al=(c.type==='num')?' num-right':'';
      return '<td class="tf'+al+' tv-'+(f.c||'blue')+'">'+(f.pre?'<span class="tf-pre">'+esc(f.pre)+'</span>':'')+'<span id="'+f.id+'">—</span></td>';
    }).join('')+'<td class="tf"></td></tr></tfoot>';
  }
  return '<div class="tw"><table><thead><tr>'+colsOf(t).map(c=>'<th'+(c.w?' style="width:'+c.w+'"':'')+'>'+esc(c.l)+'</th>').join('')
    +'<th style="width:28px"></th></tr></thead><tbody id="tb-'+t.id+'">'+rows.map(r=>rowHTML(t,r)).join('')+'</tbody>'+foot+'</table></div>'
    +'<button class="tadd tadd-'+cf+'" onclick="addRow(\''+t.id+'\')">'+esc(t.add||'+ Thêm dòng')+'</button>';
}

function blockHTML(b,d){
  if(!inMode(b)) return '';
  if(b.co) return '<div class="callout co-'+b.co+'"><span class="co-t">'+b.t+'</span>'+b.x+'</div>';
  if(b.chain) return chainHTML();
  if(b.btn) return '<div style="margin:10px 0"><button class="btn btn-p'+cf+'" id="'+b.btn.id+'" onclick="'+b.btn.fn+'">'+b.btn.label+'</button></div>';
  if(b.metrics){ const ms=b.metrics.filter(inMode);
    return '<div class="tw totrow"><table><thead><tr><th style="width:90px">Hàng tổng</th>'
      + ms.map(m=>'<th>'+esc(m.l)+'</th>').join('')+'</tr></thead><tbody><tr>'
      + '<td class="tot-lbl">Σ TỔNG</td>'
      + ms.map(m=>'<td class="tot-val tv-'+m.c+'" id="'+m.id+'">—</td>').join('')
      + '</tr></tbody></table></div>'; }
  let h='<div class="fs">';
  if(b.title) h+='<div class="stitle st'+cf+'">'+esc(b.title)+'</div>';
  if(b.fields) h+='<div class="fg">'+b.fields.filter(inMode).map(f=>fieldHTML(f,d)).join('')+'</div>';
  if(b.table) h+=tableHTML(b.table,d);
  if(b.check) h+=b.check.map((c,i)=>'<div class="ck-row"><input type="checkbox" id="ck_'+i+'" '+(d['ck_'+i]?'checked':'')
      +' style="width:16px;height:16px;flex-shrink:0"/><label for="ck_'+i+'" style="font-size:13px;cursor:pointer">'+esc(c)+'</label></div>').join('');
  return h+'</div>';
}

function addRow(tid){
  const step=FLOWS[cf].steps[cs[cf]];
  let t=null; step.body.forEach(b=>{ if(b.table&&b.table.id===tid) t=b.table; });
  if(!t) return;
  document.getElementById('tb-'+tid).insertAdjacentHTML('beforeend',rowHTML(t,{}));
  recalc();
}

// Bung dải lô nhập ở D-2 thành từng lô để chọn khi xuất kho
function loTuD2(){
  const rows=(state['4_1']||{}).d1_lo||[];
  const maC=(state['3_3']||{})._maC||'';
  const ngay=(state['4_0']||{}).d1_ngay||'';
  const tp=(state['4_0']||{}).d1_ma_sp||LOAI_TP[0];
  const out=[];
  rows.forEach(function(r){
    const tu=n(r.tu), den=n(r.den), ng=r.nguon||'Khai thác';
    if(tu>0 && den>=tu){ for(let i=tu;i<=den;i++) out.push({lo:r.lo+'-'+i,ma_c:maC,tp:tp,nguon:ng,ton:KG_LO,ngay:ngay}); }
    else if(tu>0 && n(r.le)>0) out.push({lo:r.lo+'-'+tu,ma_c:maC,tp:tp,nguon:ng,ton:n(r.le),ngay:ngay});
  });
  return out;
}
function poolOf(name){
  if(name==='loTP'){ const l=loTuD2(); return l.length? l : (POOL.loTP||[]); }
  return POOL[name]||[];
}

function pickRow(el,poolName){
  const list=poolOf(poolName), k=POOL_KEY[poolName];
  const rec=list.filter(function(r){return r[k]===el.value;})[0];
  const tr=el.closest('tr');
  tr.querySelectorAll('[data-k]').forEach(function(c){
    if(c===el) return;
    const key=c.dataset.k;
    if(rec && rec[key]!==undefined) c.value=rec[key];
    else if(!rec) c.value='';
  });
  recalc();
}

function readTable(tid){
  const tb=document.getElementById('tb-'+tid); if(!tb) return [];
  return Array.from(tb.rows).map(tr=>{
    const o={};
    tr.querySelectorAll('[data-k]').forEach(el=>{ o[el.dataset.k]= el.type==='checkbox'?el.checked:el.value; });
    return o;
  });
}
function cellEl(tid,i,k){ const tb=document.getElementById('tb-'+tid); if(!tb||!tb.rows[i]) return null; return tb.rows[i].querySelector('[data-k="'+k+'"]'); }

function prevStep(){ saveForm(); if(cs[cf]>0){cs[cf]--;save();renderNav();renderCard();scrollTo(0,0);} }
function nextFlow(){ saveForm(); if(cf<FLOWS.length-1){ cf++; save(); renderAll(); scrollTo(0,0);} else { goOverview(); } }
function markDone(){ saveForm(); if(!state[key()]) state[key()]={}; state[key()].done=true; save(); renderNav(); }

function saveForm(){
  if(cf<0) return;
  const d={};
  document.querySelectorAll('#sc input[id], #sc select[id], #sc textarea[id]').forEach(el=>{
    d[el.id] = el.type==='checkbox' ? el.checked : el.value;
  });
  const step=FLOWS[cf].steps[cs[cf]];
  step.body.forEach(b=>{ if(b.table) d[b.table.id]=readTable(b.table.id); });
  const old=state[key()]||{};
  state[key()]=Object.assign({},old,d);
  save();
}

function pad(v,l){ const s=String(v==null?'':v).replace(/\D/g,''); return s? s.padStart(l,'0').slice(-l):''; }
function dparts(v){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||''); return m?{y4:m[1],yy:m[1].slice(2),mm:m[2],dd:m[3]}:null; }
function setV(id,v){ const e=document.getElementById(id); if(e && (e.readOnly || !e.value)) e.value=v; else if(e && e.readOnly) e.value=v; }


function recalc(){
  if(cf<0) return;
  const k=cf+'_'+cs[cf];
  if(k==='0_1') calcA2();
  if(k==='0_2') calcA3();
  if(k==='0_3') calcA4();
  if(k==='1_1') calcNK2();
  if(k==='1_2') calcNK3();
  if(k==='2_1') calcB2();
  if(k==='3_0') calcC1();
  if(k==='3_1') calcC2();
  if(k==='3_2') calcC3();
  if(k==='3_3') calcC4();
  if(k==='3_5') calcC6();
  if(k==='4_0') calcD1();
  if(k==='4_1') calcD2();
  if(k==='5_0') calcX1();
  if(k==='5_1') calcX2();
  if(k==='5_2') calcX3();
  if(k==='5_3') calcX4();
}


function setRO(id,v){ const e=document.getElementById(id); if(e) e.value=v; }

  const d=dparts(document.getElementById('c1_ngay')?.value);

function calcC2(){
  const maC=(state['3_0']||{})._maC||'';
  setRO('c2_ma_c',maC);
  const rows=readTable('c1_ma_b');
  let vao=0,kt=0,tm=0;
  rows.forEach((r,i)=>{
    // Chỉ định CB / CBxxx / CBxx%
    const ton=n(r.ton), cb=String(r.cb||'').trim().toUpperCase();
    let lay=n(r.lay);
    if(cb){
      if(cb==='CB') lay=ton;
      else if(/^CB[\d.]+%$/.test(cb)) lay=ton*parseFloat(cb.slice(2))/100;
      else if(/^CB[\d.]+$/.test(cb)) lay=parseFloat(cb.slice(2));
      const el=cellEl('c1_ma_b',i,'lay'); if(el && lay) el.value=Math.round(lay*100)/100;
    }
    vao+=lay;
    // cơ cấu KT/TM suy từ nguồn của Mã B
    const src=(POOL.maB||[]).filter(function(x){return x.ma_b===r.ma_b;})[0];
    let rkt=0,rtm=0;
    if(src){ const t=n(src.kt)+n(src.tm); if(t>0){ rkt=lay*n(src.kt)/t; rtm=lay*n(src.tm)/t; } }
    else if((r.nguon||'')==='Thu mua') rtm=lay; else rkt=lay;
    kt+=rkt; tm+=rtm;
  });
  let ton=0; rows.forEach(r=>ton+=n(r.ton));
  setM('c1_m_ton',fmt(ton));
  setM('c1_m_vao',fmt(vao));
  setRO('c2_tl_kt', vao? fmt(kt/vao*100)+' %' : ''); setRO('c2_tl_tm', vao? fmt(tm/vao*100)+' %' : '');
  state['3_1']=Object.assign({},state['3_1'],{_vao:vao,_kt:kt,_tm:tm,_maC:maC});
  save();
}

function calcC4(){
  const st=state['3_1']||{};

  setRO('c3_vao', vao? fmt(vao) : '');
  setRO('c3_tp', tp? fmt(tp) : '');

}

function calcD2(){
  setRO('d2_ma_d',(state['4_0']||{})._maD||'');
  const rows=readTable('d1_lo');
  let kl=0, le=0, soLo=0;
  rows.forEach(function(r,i){
    const tu=n(r.tu), den=n(r.den);
    const cell=cellEl('d1_lo',i,'kl');
    let v=0;
    if(tu>0 && den>=tu){ const sl=den-tu+1; v=sl*KG_LO; soLo+=sl; if(cell) cell.value=Math.round(v*100)/100; }
    else { if(cell) cell.value=''; if(tu>0 && n(r.le)>0) soLo+=1; }
    kl+=v; le+=n(r.le);
  });
  setM('d1_m_lo',soLo); setM('d1_m_kl',fmt(kl)); setM('d1_m_le',fmt(le));
  const tong=kl+le, nhap=n((state['4_0']||{})._kl);
  setRO('d2_so_lo',soLo);
  setRO('d2_tong_lo', tong? fmt(tong) : '');
  setRO('d2_kl_nhap', nhap? fmt(nhap) : '');
  setRO('d2_check', (!tong||!nhap)? '' : (Math.abs(tong-nhap)<0.01? '✓ Khớp tổng KL thành phẩm thực tế'
        : '⚠ Lệch '+fmt(tong-nhap)+' kg so với KL thành phẩm — kiểm tra lại số lô hoặc lô lẻ'));
  state['4_1']=Object.assign({},state['4_1'],{_lo:soLo,_kl:tong});
  save();
}




// Comment 9: số bành = KL / 35, cảnh báo nếu không chia hết
function kiemTraBanh(kl, idBanh){
  setRO(idBanh, kl? fmt(kl/KG_BANH)+' bành' : '');
}

function calcX1(){
  kiemTraBanh(n(document.getElementById('x1_kl')?.value),'x1_so_banh');
}

function calcX2(){
  const d=dparts(document.getElementById('x2_ngay')?.value);
  const stt=pad((state['5_1']||{})._stt||1,3);
  const e=document.getElementById('x2_ma_lenh'); if(e) e.value='LXH-'+stt;
  kiemTraBanh(n(document.getElementById('x2_kl')?.value)||n((state['5_0']||{}).x1_kl),'x2_so_banh');
  state['5_1']=Object.assign({},state['5_1'],{_maLenh:'LXH-'+stt,_maPhieu:d?'F03X-'+d.y4+'-'+stt:'F03X-'+stt}); save();
}

function calcX3(){
  const can=n((state['5_1']||{}).x2_kl)||n((state['5_0']||{}).x1_kl);
  const rows=readTable('x3_ton');
  let chon=0,kt=0,tm=0,ton=0;
  rows.forEach(r=>{ ton+=n(r.ton);
    const k=n(r.kl); if(k>0){ chon+=k; if(r.nguon==='Thu mua') tm+=k; else kt+=k; } });
  setM('x3_m_can',can?fmt(can):'—');
  setM('x3_m_ton',fmt(ton));
  setM('x3_m_chon',fmt(chon));
  setM('x3_m_thieu', can? (can-chon>0? '−'+fmt(can-chon) : '+'+fmt(chon-can)) : '—');
  setRO('x3_tl_kt', chon? fmt(kt/chon*100)+' %' : ''); setRO('x3_tl_tm', chon? fmt(tm/chon*100)+' %' : '');
  state['5_2']=Object.assign({},state['5_2'],{_chon:chon,_kt:kt,_tm:tm}); save();
}

function calcX4(){
  const s2=state['5_1']||{}, s3=state['5_2']||{};
  setRO('x4_ma_phieu',s2._maPhieu||'');
  setRO('x4_kl',fmt(n(s3._chon)));
  const kt=n(s3._kt), tm=n(s3._tm), tot=kt+tm;

  const rows=readTable('x4_lo');
  let kl=0,a=0,b=0; rows.forEach(r=>{ const v=n(r.kl)||0; kl+=v; if(r.nguon==='Thu mua') b+=v; else a+=v; });
  setM('x4_m_kl',fmt(kl));
  setRO('x4_tl_kt', kl? fmt(a/kl*100)+' %' : ''); setRO('x4_tl_tm', kl? fmt(b/kl*100)+' %' : '');
}

   +box(284,'Lô bãi ủ','Mã B','#1A7A5E')+arrow(396)

function resetAll(){
  if(!confirm('Xoá toàn bộ dữ liệu đã nhập thử trong trình duyệt?')) return;
  state={}; try{ sessionStorage.clear(); sessionStorage.setItem('cs_ver',STORE_VER); }catch(e){}
  cs=FLOWS.map(()=>0); save(); goOverview();
}

/* BOOT */
if(cf>=FLOWS.length) cf=-1;
FLOWS.forEach((fl,i)=>{ if(!cs[i]||cs[i]>=fl.steps.length) cs[i]=0; });
if(cf===-2||cf===-3) cf=-1;
if(cf<0){ goOverview(); } else { renderAll(); }
</script>
