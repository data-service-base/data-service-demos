<!DOCTYPE html>
<html lang="vi">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHS Property — Hệ thống lương & hoa hồng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
 --font-sans:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
 --bg:#f3f6fa;--panel:#ffffff;--ink:#1b2330;--ink2:#5a6677;--ink3:#98a2b1;
 --brand:#185FA5;--brand-d:#0C447C;--border:#e7eaef;
}
@media(prefers-color-scheme:dark){:root{
 --bg:#0d1218;--panel:#11161d;--ink:#e7ecf2;--ink2:#9aa6b4;--ink3:#6b7686;
 --brand:#5BA0E6;--brand-d:#185FA5;--border:#2a323d;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh}
.topbar{background:var(--panel);border-bottom:.5px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mono{width:46px;height:46px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand-d));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;letter-spacing:.5px;flex-shrink:0}
.co{flex:1 1 auto;min-width:200px}
.co-name{font-size:15px;font-weight:600;line-height:1.25}
.co-meta{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.4}
.co-meta b{color:var(--ink);font-weight:500}
.nav{display:flex;gap:4px;background:var(--bg);border:.5px solid var(--border);border-radius:10px;padding:3px;flex-shrink:0}
.nav button{border:none;background:none;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink2);padding:8px 16px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.nav button.on{background:var(--panel);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.nav button:hover:not(.on){color:var(--ink)}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.stage{flex:1 1 auto;position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--bg)}
@media(max-width:640px){.topbar{padding:10px 14px;gap:10px}.mono{width:40px;height:40px;font-size:15px}.co-name{font-size:13.5px}.nav{width:100%;order:3}.nav button{flex:1 1 0;justify-content:center;padding:8px 8px}}
</style>
<style>
/* ==== responsive: phone (portrait + landscape) ==== */
@supports(height:100dvh){body{height:100dvh}}
@media(max-width:380px){.nav button{font-size:12px;padding:7px 6px;gap:5px}.co-name{font-size:12.5px}.mono{width:36px;height:36px;font-size:14px}}
</style>
</head>
<body>

      Tổng quan quỹ lương

    </button>
  </div>
</div>

  <iframe id="frame" title="Nội dung trang"></iframe>
</div>
<script>
const PAGES={"overview.html": "<!DOCTYPE html>\n<html lang=\"vi\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>AHS — Tổng quan quỹ lương<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap\">\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js\"><\/script>\n<style>\n:root{\n --font-sans:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;\n --color-background-primary:#ffffff;--color-background-secondary:#f3f6fa;--color-background-info:#e9f1fb;\n --color-text-primary:#1b2330;--color-text-secondary:#5a6677;--color-text-tertiary:#98a2b1;--color-text-info:#185FA5;\n --color-border-tertiary:#e7eaef;--color-border-secondary:#d6dbe2;--color-border-info:#bdd6f2;\n --border-radius-md:8px;--border-radius-lg:12px;\n}\n@media(prefers-color-scheme:dark){:root{\n --color-background-primary:#11161d;--color-background-secondary:#1a212b;--color-background-info:#16273a;\n --color-text-primary:#e7ecf2;--color-text-secondary:#9aa6b4;--color-text-tertiary:#6b7686;--color-text-info:#5BA0E6;\n --color-border-tertiary:#2a323d;--color-border-secondary:#3a434f;--color-border-info:#2f567f;\n}}\nhtml,body{margin:0;padding:0;background:var(--color-background-secondary);font-family:var(--font-sans);color:var(--color-text-primary)}\n.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}\n.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}\nbutton,input,select{font-family:inherit}\ninput,select{border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary)}\n<\/style>\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\n.ov{font-size:13px;line-height:1.5}\n.ov-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}\n.ov-ttl{font-size:16px;font-weight:500}\n.ov-sub{font-size:12px;color:var(--color-text-secondary);margin-top:1px}\n.flt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.flt-g{display:flex;align-items:center;background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:0 6px 0 10px}\n.flt-g label{font-size:10px;color:var(--color-text-secondary);font-weight:500;text-transform:uppercase;letter-spacing:.03em;margin-right:6px}\n.flt-g input,.flt-g select{border:none;height:32px;font-size:13px;background:transparent;color:var(--color-text-primary);padding:0 4px}\n.flt-g input[type=date]{width:130px}\n.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px;margin-bottom:12px}\n.kpi{background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:11px 12px}\n.kpi.hl{background:var(--color-background-info);border-color:var(--color-border-info)}\n.kpi-l{font-size:10px;color:var(--color-text-secondary);font-weight:500;text-transform:uppercase;letter-spacing:.03em;margin-bottom:5px}\n.kpi.hl .kpi-l{color:var(--color-text-info)}\n.kpi-v{font-size:18px;font-weight:500}\n.kpi.hl .kpi-v{color:var(--color-text-info)}\n.kpi-s{font-size:10px;color:var(--color-text-secondary);margin-top:2px}\n.row2{display:flex;flex-wrap:nowrap;gap:12px;margin-bottom:12px;overflow-x:auto}\n.row2>.card{flex:1 1 0;min-width:300px}\n.card{background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:13px 14px;margin-bottom:12px}\n.card.nb{margin-bottom:0}\n.shd{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}\n.shd-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}\n.shd-row .shd{margin-bottom:0}\n.seg{display:inline-flex;background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:2px}\n.seg button{border:none;background:none;font-size:12px;font-weight:500;color:var(--color-text-secondary);padding:5px 14px;border-radius:6px;cursor:pointer}\n.seg button.on{background:var(--color-background-primary);color:var(--color-text-info);box-shadow:0 1px 2px rgba(0,0,0,.06)}\n.cmp-leg{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;justify-content:center}\n.cmp-leg span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--color-text-secondary)}\n.cmp-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}\n.tbl{width:100%;border-collapse:collapse;font-size:12px}\n.tbl th{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-align:right;padding:8px;background:var(--color-background-secondary);border-bottom:.5px solid var(--color-border-tertiary);white-space:nowrap}\n.tbl th:first-child{text-align:left}\n.tbl td{padding:8px;border-bottom:.5px solid var(--color-border-tertiary);text-align:right;white-space:nowrap}\n.tbl td:first-child{text-align:left}\n.tbl tbody tr:last-child td{border-bottom:none}\n.tbl tr.tot td{background:var(--color-background-secondary);font-weight:500;border-top:1px solid var(--color-border-secondary)}\n.exp-row{cursor:pointer}\n.exp-row:hover>td{filter:brightness(.97)}\n.det{display:none}\n.det.open{display:table-row}\n.det-emp{display:none}\n.det-emp.open{display:table-row}\n.det-emp>td{font-size:11.5px;padding-top:6px;padding-bottom:6px}\n.det-emp>td:first-child{padding-left:26px;border-left:2px solid var(--color-border-info)}\n.det-emp .ema{color:var(--color-text-secondary);font-weight:400;font-size:11px;margin-left:3px}\n.chev{color:var(--color-text-tertiary);display:inline-flex;align-items:center;vertical-align:middle;margin-left:6px}\n.exp-row:hover .chev{color:var(--color-text-info)}\n.cv{transition:transform .15s ease;display:block}\n.cv.open{transform:rotate(180deg)}\n.pos{color:var(--color-text-info)}\n.bdg{display:inline-block;font-size:10px;padding:2px 7px;border-radius:3px;font-weight:500;background:var(--color-background-info);color:var(--color-text-info)}\n.bdg.g{background:var(--color-background-secondary);color:var(--color-text-secondary)}\n.itbl{width:100%;border-collapse:collapse;font-size:11.5px;background:var(--color-background-primary);border-radius:var(--border-radius-md);overflow:hidden}\n.itbl th{font-size:10px;font-weight:500;color:var(--color-text-secondary);text-align:right;padding:6px 8px;background:transparent;border-bottom:.5px solid var(--color-border-tertiary)}\n.itbl th:first-child{text-align:left}\n.itbl td{padding:5px 8px;border-bottom:.5px solid var(--color-border-tertiary);text-align:right}\n.itbl td:first-child{text-align:left;font-weight:500}\n.itbl tr:last-child td{border-bottom:none}\n.note{font-size:11px;color:var(--color-text-secondary);margin-top:8px}\n.det-wrap{background:var(--color-background-secondary);padding:9px 12px}\n.empty{padding:14px;text-align:center;color:var(--color-text-secondary);font-size:12px}\n.heat-legend{display:flex;align-items:center;gap:7px;margin-top:9px;font-size:10px;color:var(--color-text-secondary);flex-wrap:wrap}\n.heat-legend i{display:block;width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(24,95,165,.05),rgba(24,95,165,.47))}\n<\/style>\n<style>\n/* ==== responsive: phone (portrait + landscape) ==== */\n@media(max-width:760px){.row2{flex-wrap:wrap;overflow-x:visible}.row2>.card{flex:1 1 100%;min-width:0}}\n@media(max-width:560px){.wrap{padding:12px 11px 30px}.flt{flex-direction:column;align-items:stretch}.flt-g{width:100%}.flt-g input[type=date]{width:auto;flex:1 1 0}.ov-ttl{font-size:15px}.kpi-v{font-size:16px}.kpis{gap:7px}}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n<h2 class=\"sr-only\">Tổng quan quỹ lương AHS — HR & BOD<\/h2>\n<div class=\"ov\">\n  <div class=\"ov-hdr\">\n    <div>\n      <div class=\"ov-ttl\">Tổng quan Quỹ lương — Khối Kinh doanh<\/div>\n      <div class=\"ov-sub\">Công ty CP Bất Động Sản AHS · Báo cáo cho Ban TGĐ &amp; Phòng Nhân sự<\/div>\n    <\/div>\n    <div class=\"flt\">\n      <div class=\"flt-g\"><label>Từ<\/label><input type=\"date\" id=\"fStart\" value=\"2026-01-01\"><\/div>\n      <div class=\"flt-g\"><label>Đến<\/label><input type=\"date\" id=\"fEnd\" value=\"2026-01-31\"><\/div>\n      <div class=\"flt-g\"><label>Khối<\/label><select id=\"fKhoi\"><\/select><\/div>\n    <\/div>\n  <\/div>\n  <div id=\"kpis\" class=\"kpis\"><\/div>\n  <div class=\"row2\">\n    <div class=\"card nb\">\n      <div class=\"shd\">Cơ cấu quỹ lương<\/div>\n      <div style=\"position:relative;height:175px\"><canvas id=\"cCmp\" role=\"img\" aria-label=\"Cơ cấu quỹ lương\">Cơ cấu.<\/canvas><\/div>\n      <div id=\"cmpLeg\" class=\"cmp-leg\"><\/div>\n    <\/div>\n    <div class=\"card nb\">\n      <div class=\"shd\">Quỹ lương theo khối (triệu đ)<\/div>\n      <div style=\"position:relative;height:240px\"><canvas id=\"cKhoi\" role=\"img\" aria-label=\"Quỹ lương theo khối\">Theo khối.<\/canvas><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"row2\">\n    <div class=\"card nb\">\n      <div class=\"shd\">Lương dự án — HH kỳ này (triệu đ)<\/div>\n      <div style=\"position:relative;height:240px\"><canvas id=\"cProj\" role=\"img\" aria-label=\"HH theo dự án\">Theo dự án.<\/canvas><\/div>\n    <\/div>\n    <div class=\"card nb\">\n      <div class=\"shd\">Xu hướng quỹ lương 7 tháng (tỷ đồng)<\/div>\n      <div style=\"position:relative;height:240px\"><canvas id=\"cTrend\" role=\"img\" aria-label=\"Xu hướng quỹ lương\">Xu hướng.<\/canvas><\/div>\n      <div class=\"note\" id=\"trendNote\"><\/div>\n    <\/div>\n  <\/div>\n  <div class=\"card\">\n    <div class=\"shd-row\">\n      <div class=\"shd\">Chi tiết quỹ lương theo phòng ban — nhấn từng phòng để xem nhân sự<\/div>\n      <div class=\"seg\"><button id=\"segMoney\" class=\"on\" onclick=\"window.setMode('money')\">Số tiền<\/button><button id=\"segPct\" onclick=\"window.setMode('pct')\">%<\/button><\/div>\n    <\/div>\n    <div style=\"overflow-x:auto\"><table class=\"tbl\" id=\"tDetail\"><\/table><\/div>\n    <div class=\"heat-legend\"><span>Giá trị thấp<\/span><i><\/i><span>Giá trị cao<\/span><span style=\"margin-left:auto\">Tab “%”: theo % Tổng quỹ; cột cuối = % thực chi (Thực chi / Tổng quỹ)<\/span><\/div>\n  <\/div>\n  <div class=\"card\">\n    <div class=\"shd\">Lương dự án — nhấn từng dự án để xem nhân viên được hưởng hoa hồng<\/div>\n    <div style=\"overflow-x:auto\"><table class=\"tbl\" id=\"tProj\"><\/table><\/div>\n    <div class=\"note\" id=\"projNote\"><\/div>\n  <\/div>\n<\/div>\n<\/div>\n\n<script>\n(function(){\nconst BCOLS=['#185FA5','#378ADD','#85B7EB','#0C447C','#5B9BD5','#B5D4F4','#2E6DA4'];\nconst isDark=matchMedia('(prefers-color-scheme:dark)').matches;\nconst txS=isDark?'rgba(255,255,255,.45)':'rgba(55,65,81,.55)';\nconst gC=isDark?'rgba(255,255,255,.07)':'rgba(0,0,0,.05)';\nconst fM=n=>{n=Math.round(n);return Math.abs(n)>=1e9?(n/1e9).toFixed(2).replace(/\\.?0+$/,'')+' tỷ':(Math.round(n/100000)/10).toFixed(1)+'M';};\nconst fB=n=>(n/1e9).toFixed(2)+' tỷ';\nconst fMoney=n=>Math.abs(n)>=1e9?fB(n):fM(n);\nfunction projCan(da,seed){const PRE={'Masteri Era Landmark':'MEL','An Lạc Riverside':'ALR','Hà Đô Charm Villas':'HDC','Sunshine City Sài Gòn':'SSC','Vinhomes Ocean Park 3':'VOP','Vinhomes Smart City':'VSC'};const p=PRE[da]||(''+da).replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'AHS';return p+'-'+String(20+(seed*7)%40).padStart(2,'0')+'-'+String(1+(seed*3)%18).padStart(2,'0');}\nconst P=(a,b)=>b?(a/b*100).toFixed(0)+'%':'—';\nconst CV='<span class=\"chev\"><svg class=\"cv\" viewBox=\"0 0 24 24\" width=\"13\" height=\"13\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9l6 6 6-6\"><\/path><\/svg><\/span>';\nfunction mm(a){let mn=Infinity,mx=-Infinity;a.forEach(v=>{if(v<mn)mn=v;if(v>mx)mx=v;});return{mn,mx};}\nfunction heat(v,o){if(!o||!isFinite(o.mn)||o.mx===o.mn)return '';const t=(v-o.mn)/(o.mx-o.mn);return 'background:rgba(24,95,165,'+(0.05+0.42*t).toFixed(3)+')';}\nfunction progTax(t){if(t<=0)return 0;const b=[[5e6,.05],[5e6,.1],[8e6,.15],[14e6,.2],[20e6,.25],[28e6,.3],[Infinity,.35]];let x=0,r=t;for(const[l,rt]of b){if(r<=0)break;const tx=Math.min(r,l);x+=tx*rt;r-=tx;}return Math.round(x);}\nconst FIRST=['Nguyễn','Trần','Lê','Phạm','Hoàng','Vũ','Đặng','Bùi','Đỗ','Hồ','Ngô','Dương','Lý','Phan','Mai','Trịnh','Cao','Đinh','Vương','Tô'];\nconst MID=['Văn','Thị','Minh','Quang','Đức','Thu','Ngọc','Hữu','Gia','Khánh'];\nconst LAST=['An','Bình','Cường','Dũng','Hà','Hải','Hoa','Huy','Lan','Linh','Long','Mai','Nam','Phúc','Quân','Sơn','Tâm','Thảo','Trang','Tú','Vy','Yến'];\nfunction mix(role){if(role==='CTV')return{lc:0,hh:.92,thuong:.08,pc:0};if(role.indexOf('Tổng')>=0||role.indexOf('TGĐ')>=0)return{lc:.60,hh:0,thuong:.36,pc:.04};if(role.indexOf('Ekip')>=0||role.indexOf('Dự án')>=0)return{lc:.80,hh:.08,thuong:.08,pc:.04};if(role.indexOf('phòng')>=0||role==='Chuyên viên'||role==='Nhân viên')return{lc:.84,hh:0,thuong:.11,pc:.05};return{lc:.56,hh:.24,thuong:.16,pc:.04};}\nconst cfg=[\n {ma:'A0',ten:'Ban Tổng Giám Đốc',roster:[['Tổng Giám Đốc',155e6,'NV0001'],['Phó Tổng Giám Đốc',120e6,'NV0003'],['Phó Tổng Giám Đốc',115e6,'NV0005']]},\n {ma:'A1',ten:'Khối KD A1',gen:[['GĐKD',1,40e6],['TPKD',2,24e6],['NVKD',8,14e6],['CTV',3,7e6]]},\n {ma:'A2',ten:'Khối KD A2',gen:[['GĐKD',1,38e6],['TPKD',2,23e6],['NVKD',6,14e6],['CTV',2,7e6]]},\n {ma:'A3',ten:'Khối KD A3',gen:[['GĐKD',1,42e6],['TPKD',2,24e6],['NVKD',8,14e6],['CTV',1,7e6]]},\n {ma:'HOME',ten:'Ekip Dự án (HOME)',gen:[['GĐ Dự án',1,30e6],['Chuyên viên Ekip',6,17e6]]},\n {ma:'BO',ten:'Khối Hỗ trợ (BO)',gen:[['Trưởng phòng',3,25e6],['Chuyên viên',7,15e6],['Nhân viên',5,11e6]]},\n];\nconst EMP=[];let gi=0;\nconst HHBASE={'GĐKD':46e6,'TPKD':35e6,'NVKD':32e6,'CTV':16e6,'GĐ Dự án':12e6,'Chuyên viên Ekip':5e6};\nfunction mkEmp(name,ma,dept,deptName,role,gross,seed){const m=mix(role);const lc=Math.round(gross*m.lc),hh=Math.round((HHBASE[role]||0)*(0.84+((seed||0)%8)*0.04)),thuong=Math.round(gross*m.thuong),pc=Math.round(gross*m.pc);const g=lc+hh+thuong+pc;const bhxh=role==='CTV'?0:Math.round(Math.min(lc,46800000)*.105);const thue=role==='CTV'?Math.round(hh*.10):progTax(Math.max(0,g-bhxh-11e6));return{name,ma,dept,deptName,role,lc,hh,thuong,pc,gross:g,bhxh,thue,net:g-bhxh-thue};}\ncfg.forEach(d=>{\n if(d.roster){d.roster.forEach(r=>{EMP.push(mkEmp(FIRST[gi%20]+' '+MID[gi%10]+' '+LAST[gi%22],r[2],d.ma,d.ten,r[0],r[1],gi));gi++;});}\n else{d.gen.forEach(g=>{for(let i=0;i<g[1];i++){const gross=Math.round(g[2]*(0.88+((gi*13)%7)*0.04));EMP.push(mkEmp(FIRST[(gi*7)%20]+' '+MID[(gi*3)%10]+' '+LAST[(gi*5)%22],'NV'+String(200+gi*3).slice(-3),d.ma,d.ten,g[0],gross,gi));gi++;}});}\n});\nconst DEPMETA=cfg.map(c=>({ma:c.ma,ten:c.ten}));\nconst baseProj=[\n {da:\"Masteri Era Landmark\",short:\"Masteri Era\",ds:135200000000,hh:263100000,emps:[[\"Trần Minh Tú\",\"NVKD\",36400000000,81900000],[\"Lê Thị Mai\",\"NVKD\",18200000000,41000000],[\"Phan Văn Mạnh\",\"NVKD\",15600000000,35100000],[\"Đinh Thế Sơn\",\"TPKD\",15600000000,23400000],[\"Hoàng Văn Nghĩa\",\"GĐKD\",13000000000,13000000],[\"Đặng Ngọc Phú\",\"NVKD\",10400000000,23400000],[\"Nguyễn Thu Hà\",\"CTV\",10400000000,25000000],[\"Phạm Thu Huyền\",\"TPKD\",7800000000,11700000],[\"Hồ Minh Hải\",\"Ekip DA\",7800000000,8600000]]},\n {da:\"An Lạc Riverside\",short:\"An Lạc\",ds:72800000000,hh:135700000,emps:[[\"Lê Thị Mai\",\"NVKD\",23400000000,52700000],[\"Vũ Đức Anh\",\"NVKD\",15600000000,35100000],[\"Hoàng Văn Nghĩa\",\"GĐKD\",13000000000,13000000],[\"Trịnh Thị Lan\",\"NVKD\",10400000000,23400000],[\"Hồ Minh Hải\",\"Ekip DA\",10400000000,11500000]]},\n {da:\"Hà Đô Charm Villas\",short:\"Hà Đô\",ds:62400000000,hh:126800000,emps:[[\"Trần Minh Tú\",\"NVKD\",18200000000,41000000],[\"Bùi Quang Huy\",\"NVKD\",13000000000,29300000],[\"Phạm Thu Huyền\",\"TPKD\",10400000000,15600000],[\"Ngô Thị Hà\",\"NVKD\",7800000000,17600000],[\"Đỗ Văn Sơn\",\"NVKD\",7800000000,17600000],[\"Hồ Minh Hải\",\"Ekip DA\",5200000000,5700000]]},\n {da:\"Sunshine City Sài Gòn\",short:\"Sunshine\",ds:31200000000,hh:71400000,emps:[[\"Phan Văn Mạnh\",\"NVKD\",10400000000,23400000],[\"Nguyễn Thu Hà\",\"CTV\",7800000000,18700000],[\"Lý Thị Thu\",\"NVKD\",7800000000,17600000],[\"Cao Văn Bình\",\"NVKD\",5200000000,11700000]]},\n {da:\"Vinhomes Ocean Park 3\",short:\"VH Ocean Park 3\",ds:20800000000,hh:46800000,emps:[[\"Đặng Ngọc Phú\",\"NVKD\",10400000000,23400000],[\"Mai Thị Hoa\",\"NVKD\",5200000000,11700000],[\"Trần Văn Lộc\",\"NVKD\",5200000000,11700000]]},\n {da:\"Vinhomes Smart City\",short:\"VH Smart City\",ds:15600000000,hh:29300000,emps:[[\"Đinh Thế Sơn\",\"TPKD\",7800000000,11700000],[\"Vũ Đức Anh\",\"NVKD\",7800000000,17600000]]}\n];\nconst MO=[{m:'T07',ym:'2025-07',f:0.948},{m:'T08',ym:'2025-08',f:0.964},{m:'T09',ym:'2025-09',f:0.954},{m:'T10',ym:'2025-10',f:0.973},{m:'T11',ym:'2025-11',f:0.983},{m:'T12',ym:'2025-12',f:1.031},{m:'T01',ym:'2026-01',f:1.0}];\nconst companyBaseGross=EMP.reduce((s,e)=>s+e.gross,0);\n\nlet CH={},MODE='money',VIEW=null;\nwindow.toggleRow=function(id,row){const b=document.getElementById(id);if(!b)return;const open=b.classList.toggle('open');const cv=row.querySelector('.cv');if(cv)cv.classList.toggle('open',open);};\nwindow.toggleDep=function(i,row){const rows=document.querySelectorAll('.e'+i);const open=!(rows[0]&&rows[0].classList.contains('open'));rows.forEach(r=>r.classList.toggle('open',open));const cv=row.querySelector('.cv');if(cv)cv.classList.toggle('open',open);};\nwindow.setMode=function(m){MODE=m;document.getElementById('segMoney').classList.toggle('on',m==='money');document.getElementById('segPct').classList.toggle('on',m==='pct');if(VIEW)renderDetail();};\n\ndocument.getElementById('fKhoi').innerHTML='<option value=\"ALL\" selected>Toàn khối<\/option>'+DEPMETA.map(d=>'<option value=\"'+d.ma+'\">'+d.ten+'<\/option>').join('');\n\nfunction renderDetail(){\n const el=document.getElementById('tDetail');\n const deps=VIEW.deps,G=VIEW.G;\n const lastH=MODE==='pct'?'% thực chi':'Thực chi';\n const head='<thead><tr><th>Phòng ban / Khối<\/th><th>NS<\/th><th>Lương cứng<\/th><th>Hoa hồng<\/th><th>Thưởng<\/th><th>Phụ cấp<\/th><th>Tổng quỹ<\/th><th>'+lastH+'<\/th><\/tr><\/thead>';\n if(!deps.length){el.innerHTML=head+'<tbody><tr><td colspan=\"8\"><div class=\"empty\">Không có dữ liệu cho lựa chọn này.<\/div><\/td><\/tr><\/tbody>';return;}\n const cols=['lc','hh','thuong','pc','gross','net'];\n const val=(o,k)=>MODE==='pct'?(k==='gross'?1:(o.gross?o[k]/o.gross:0)):o[k];\n const disp=(o,k)=>{if(MODE==='pct')return k==='gross'?'100%':P(o[k],o.gross);return k==='gross'?fM(o.gross):(o[k]?fM(o[k]):'—');};\n const td=(o,k,rngObj,cls)=>{const noHeat=(MODE==='pct'&&k==='gross');const st=noHeat?'':heat(val(o,k),rngObj);return '<td class=\"'+(cls||'')+'\" style=\"'+st+(cls==='pos'?';font-weight:500':'')+'\">'+disp(o,k)+'<\/td>';};\n const rng={};cols.forEach(k=>{rng[k]=mm(deps.map(d=>val(d,k)));});\n const body=deps.map((d,i)=>{\n  const emps=d.emps,erng={};cols.forEach(k=>{erng[k]=mm(emps.map(e=>val(e,k)));});\n  const depRow='<tr class=\"exp-row\" onclick=\"toggleDep('+i+',this)\"><td>'+d.ten+' <span class=\"bdg\" style=\"margin-left:4px\">'+d.ma+'<\/span>'+CV+'<\/td><td>'+d.hc+'<\/td>'+td(d,'lc',rng.lc)+td(d,'hh',rng.hh)+td(d,'thuong',rng.thuong)+td(d,'pc',rng.pc)+td(d,'gross',rng.gross,'pos')+td(d,'net',rng.net)+'<\/tr>';\n  const empRows=emps.map(e=>'<tr class=\"det-emp e'+i+'\"><td>'+e.name+'<span class=\"ema\">'+e.ma+'<\/span><\/td><td><span class=\"bdg '+(e.role==='CTV'?'g':'')+'\" style=\"font-weight:400\">'+e.role+'<\/span><\/td>'+td(e,'lc',erng.lc)+td(e,'hh',erng.hh)+td(e,'thuong',erng.thuong)+td(e,'pc',erng.pc)+td(e,'gross',erng.gross,'pos')+td(e,'net',erng.net)+'<\/tr>').join('');\n  return depRow+empRows;\n }).join('');\n const totLast=MODE==='pct'?P(G.net,G.gross):fB(G.net);\n const totTong=MODE==='pct'?'100%':fB(G.gross);\n const tot='<tr class=\"tot\"><td>'+(VIEW.khoi==='ALL'?'Toàn khối':'Tổng')+'<\/td><td>'+G.hc+'<\/td><td>'+(MODE==='pct'?P(G.lc,G.gross):fMoney(G.lc))+'<\/td><td>'+(MODE==='pct'?P(G.hh,G.gross):fM(G.hh))+'<\/td><td>'+(MODE==='pct'?P(G.thuong,G.gross):fMoney(G.thuong))+'<\/td><td>'+(MODE==='pct'?P(G.pc,G.gross):fM(G.pc))+'<\/td><td class=\"pos\">'+totTong+'<\/td><td>'+totLast+'<\/td><\/tr>';\n el.innerHTML=head+'<tbody>'+body+tot+'<\/tbody>';\n}\n\nfunction render(){\n const sRaw=document.getElementById('fStart').value||'2026-01-01';\n const eRaw=document.getElementById('fEnd').value||'2026-01-31';\n const s=sRaw<eRaw?sRaw:eRaw,e=sRaw<eRaw?eRaw:sRaw;\n const inc=MO.filter(m=>m.ym>=s.slice(0,7)&&m.ym<=e.slice(0,7));\n const numMonths=inc.length;\n const mult=inc.reduce((a,m)=>a+m.f,0);\n const khoi=document.getElementById('fKhoi').value;\n const depMap={};\n EMP.forEach(emp=>{\n  if(khoi!=='ALL'&&emp.dept!==khoi)return;\n  const D=depMap[emp.dept]||(depMap[emp.dept]={ma:emp.dept,ten:emp.deptName,hc:0,lc:0,hh:0,thuong:0,pc:0,gross:0,bhxh:0,thue:0,net:0,emps:[]});\n  const se={name:emp.name,ma:emp.ma,role:emp.role,lc:emp.lc*mult,hh:emp.hh*mult,thuong:emp.thuong*mult,pc:emp.pc*mult,gross:emp.gross*mult,bhxh:emp.bhxh*mult,thue:emp.thue*mult,net:emp.net*mult};\n  D.emps.push(se);D.hc++;['lc','hh','thuong','pc','gross','bhxh','thue','net'].forEach(k=>D[k]+=se[k]);\n });\n const deps=DEPMETA.filter(d=>depMap[d.ma]).map(d=>depMap[d.ma]);\n const G={hc:0,lc:0,hh:0,thuong:0,pc:0,gross:0,bhxh:0,thue:0,net:0};\n deps.forEach(d=>['hc','lc','hh','thuong','pc','gross','bhxh','thue','net'].forEach(k=>G[k]+=d[k]));\n const bhxhDN=Math.round(G.bhxh*21.5/10.5);\n const share=khoi==='ALL'?1:(EMP.filter(x=>x.dept===khoi).reduce((s,x)=>s+x.gross,0)/companyBaseGross);\n VIEW={deps,G,khoi};\n\n const rangeLbl=numMonths?numMonths+' able class=\"tbl\" style=\"min-width:690px;background:var(--color-background-primary)\"><thead><tr>'+'<th style=\"width:21%\">Mã căn<\/th><th style=\"width:14%\">Ngày ký<\/th><th style=\"width:18%\">Doanh số<\/th><th style=\"width:14%\">%HH (trên DS)<\/th><th style=\"width:16%\">Hoa hồng<\/th><th style=\"width:17%\">Trạng thái<\/th><\/tr><\/thead><tbody>'+x.dots.map(function(dd,i){var dsC=_ds[i];var rate=dsC?dd.hh/dsC*100:0;var st=dd.done?'<span class=\"bdg bg\">Đã nhận<\/span>':(dd.cur?'<span class=\"bdg ba\">Đang về kỳ này<\/span>':'<span class=\"bdg bgr\">Dự kiến kỳ sau<\/span>');return '<tr><td style=\"font-weight:500\">'+canCode(x.can,i)+'<\/td><td>'+(dd.paid||dd.d)+'<\/td><td>'+fM(dsC)+'<\/td><td style=\"font-weight:500\">'+rate.toFixed(2)+'%<\/td><td class=\"'+(dd.cur?'pos':'')+'\" style=\"font-weight:500\">'+f(dd.hh)+'<\/td><td>'+st+'<\/td><\/tr>';}).join('')+'<tr style=\"background:var(--color-background-secondary);font-weight:500\"><td>Tổng ('+x.dots.length+' căn)<\/td><td>—<\/td><td>'+fM(_dsT)+'<\/td><td>'+(_dsT?(x.hhTong/_dsT*100).toFixed(2):'0')+'%<\/td><td class=\"pos\">'+f(x.hhTong)+'<\/td><td>—<\/td><\/tr>'+'<\/tbody><\/table><\/div>';\n    return `\n    <tr>\n      <td style=\"font-weight:500\">${x.da}<div style=\"font-size:10px;color:var(--color-text-secondary)\">${x.dots.length} căn<\/div><\/td>\n      <td>${f(x.ds)}<\/td>\n      <td><div style=\"font-weight:500\">${(x.hhR*100).toFixed(1)}%<\/div><div style=\"font-size:10px;color:var(--color-text-secondary)\">${f(x.hhTong)}<\/div><\/td>\n      <td><div style=\"display:flex;align-items:center;gap:4px\"><span class=\"pos\" style=\"font-weight:500\">${f(dH)}<\/span><span class=\"chev\" onclick=\"toggleHH(${idx},this)\" role=\"button\" tabindex=\"0\" aria-label=\"Lịch sử nhận\">${CV}<\/span><\/div><\/td>\n      <td style=\"color:#378ADD;font-weight:500\">${cur?f(cur.hh):'—'}<\/td>\n      <td>${f(cl)}<\/td>\n      <td>${mini3(dP,tP)}<div style=\"font-size:10px;color:var(--color-text-secondary)\">${dP+tP}%<\/div><\/td>\n    <\/tr>\n    <tr class=\"hh-det\" id=\"hhdet${idx}\"><td colspan=\"7\" style=\"background:var(--color-background-secondary);padding:9px 12px\">\n      ${detRows}\n    <\/td><\/tr>`;\n  }).join('');\n  el.innerHTML=`\n  <div class=\"card\">\n    <div class=\"shd\">Hoa hồng dự án<\/div>\n    <div class=\"da-filter-wrap\">\n      <div class=\"da-filter-btn\" onclick=\"toggleDA('dadd')\">\n        <span style=\"color:var(--color-text-secondary);display:inline-flex\">${ico('filter',14)}<\/span>\n        <span>${lbl}<\/span>\n        <span style=\"margin-left:auto;color:var(--color-text-secondary);display:inline-flex\">${ico('chevron-down',13)}<\/span>\n      <\/div>\n      <div id=\"dadd\" class=\"da-dropdown\">\n        <div class=\"da-dd-hdr\">Lọc theo dự án<\/div>\n        <div class=\"da-opt\"><input type=\"checkbox\" id=\"daall\" ${isAll?'checked':''} onchange=\"daAll()\"><label for=\"daall\">Tất cả dự án<\/label><\/div>\n        ${d.hhDa.map((x,i)=>`<div class=\"da-opt\"><input type=\"checkbox\" id=\"dachk${i}\" value=\"${x.da}\" ${selDA.has(x.da)?'checked':''} onchange=\"daCheck(this)\"><label for=\"dachk${i}\">${x.da}<\/label><\/div>`).join('')}\n      <\/div>\n    <\/div>\n    <div style=\"font-size:13px;color:var(--color-text-secondary);margin-bottom:10px\">HH kỳ này (${show.length} DA): <strong style=\"color:var(--color-text-info)\">${f(totHH)}<\/strong><\/div>\n    <div style=\"overflow-x:auto;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md)\">\n      <table class=\"tbl\" style=\"min-width:720px\">\n        <thead><tr><th style=\"width:22%\">Dự án<\/th><th style=\"width:13%\">Doanh số<\/th><th style=\"width:15%\">HH (%DS · tiền)<\/th><th style=\"width:14%\">Đã nhận<\/th><th style=\"width:13%\">Kỳ này<\/th><th style=\"width:12%\">Còn lại<\/th><th style=\"width:11%\">% tiến độ<\/th><\/tr><\/thead>\n        <tbody>${rows}\n          <tr style=\"background:var(--color-background-secondary);font-weight:500\"><td>Tổng cộng (${show.length} DA)<\/td><td>${fM(sDS)}<\/td><td>${f(sHHt)}<\/td><td class=\"pos\">${f(sDa)}<\/td><td style=\"color:#378ADD;font-weight:500\">${f(sCur)}<\/td><td>${f(sCl)}<\/td><td>${sHHt?mini3(Math.round(sDa/sHHt*100),Math.round(sCur/sHHt*100)):''}<div style=\"font-size:10px;color:var(--color-text-secondary)\">${sHHt?Math.round((sDa+sCur)/sHHt*100):0}%<\/div><\/td><\/tr>\n        <\/tbody>\n      <\/table>\n    <\/div>\n    <div style=\"display:flex;gap:12px;font-size:10px;color:var(--color-text-secondary);margin-top:7px\">\n      <span><span style=\"width:9px;height:9px;border-radius:2px;background:#185FA5;display:inline-block;vertical-align:middle;margin-right:3px\"><\/span>Đã nhận<\/span>\n      <span><span style=\"width:9px;height:9px;border-radius:2px;background:#378ADD;display:inline-block;vertical-align:middle;margin-right:3px\"><\/span>Kỳ này<\/span>\n      <span><span style=\"width:9px;height:9px;border-radius:2px;background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);display:inline-block;vertical-align:middle;margin-right:3px\"><\/span>Còn lại<\/span>\n    <\/div>\n  <\/div>`;\n}\n\nfunction rTeam(d,c,mon,cid){\n  const tm=d.teamMembers||[];\n  const totalDS=tm.reduce((s,x)=>s+x.ds,0);\n  const totalHH=tm.reduce((s,x)=>s+x.hh,0);\n  const cur=d.hhTiers.find(t=>t.m===activeMuc(d));\n  const next=d.hhTiers.find(t=>t.need>d.dsTeam);\n  const curHH=cur?Math.round(d.dsTeam*0.015*cur.r/100):0;\n  const nextHH=next?Math.round(d.dsTeam*0.015*next.r/100):0;\n  const diffHH=nextHH-curHH;\n  const tierCards=`<div class=\"tier-row\">${d.hhTiers.map(t=>{\n    const isOn=t.m===activeMuc(d);const reach=t.need?Math.min(100,Math.round(d.dsTeam/t.need*100)):100;const hh=Math.round(d.dsTeam*0.015*t.r/100);\n    return`<div class=\"tier-c ${isOn?'active':''}\"><div class=\"tier-m\">${t.m} ${isOn?'<span class=\"bdg ba\">Đang áp<\/span>':''}<\/div><div class=\"tier-r ${isOn?'pos':''}\">${t.r}%<\/div><div class=\"tier-hhval ${isOn?'pos':''}\">${f(hh)}<\/div><div class=\"tier-note\">${t.need?'Cần DS ≥ '+fM(t.need):'Mức cơ bản'}<\/div>${!isOn&&t.need>d.dsTeam?`<div style=\"font-size:11px;color:var(--color-text-danger);margin-top:3px;font-weight:500\">+${f(hh-curHH)} nếu đạt · cần thêm ${fM(t.need-d.dsTeam)}<\/div>`:isOn&&next?`<div style=\"font-size:11px;color:var(--color-text-info);margin-top:3px\">Lên ${next.m}: +${f(diffHH)}<\/div>`:''}${t.need?`<div class=\"pg\" style=\"margin-top:5px\"><div class=\"pf\" style=\"width:${reach}%;background:${reach>=100?'#185FA5':reach>=60?'#378ADD':'#85B7EB'}\"><\/div><\/div>`:''}<\/div>`;\n  }).join('')}<\/div>`;\n  const rows=tm.map((m,i)=>{\n    const pt=totalDS?Math.round(m.ds/totalDS*100):0;\n    const avgHH=m.projects.length?(m.projects.reduce((s,p)=>s+(p.ds?p.hh/p.ds:0),0)/m.projects.length*100):0;\n    const kpiPct=m.kpi?Math.round(m.ds/m.kpi*100):0;\n    const kpiC=kpiPct>=100?'#185FA5':kpiPct>=50?'#378ADD':'#85B7EB';\n    const projRows=m.projects.map((p,pi)=>`<tr><td style=\"font-weight:500\">${p.da}<\/td><td style=\"font-size:11px;color:var(--color-text-secondary)\">${projCan(p.da,i*10+pi)}<\/td><td>${f(p.ds)}<\/td><td style=\"font-size:11px;color:var(--color-text-secondary)\">${(p.hh/p.ds*100).toFixed(1)}%<\/td><td class=\"pos\" style=\"font-weight:500\">${f(p.hh)}<\/td><\/tr>`).join('');\n    return`\n    <tr class=\"tm-row\" onclick=\"toggleTeam(${i}, this.querySelector('.tmchev'))\">\n      <td style=\"font-weight:500\">${m.name}<\/td>\n      <td style=\"font-size:11px;color:var(--color-text-secondary)\">${m.ma}<\/td>\n      <td><span class=\"bdg ${m.role==='CTV'?'bgr':'bi'}\">${m.role}<\/span><\/td>\n      <td style=\"font-weight:500\">${fM(m.ds)}<\/td>\n      <td><div style=\"display:flex;align-items:center;gap:4px\"><div style=\"height:4px;width:${pt}px;max-width:42px;background:${BCOLS[i%BCOLS.length]};border-radius:2px\"><\/div><span style=\"font-size:11px\">${pt}%<\/span><\/div><\/td>\n      <td style=\"font-weight:500\">${avgHH.toFixed(1)}%<\/td>\n      <td class=\"pos\" style=\"font-weight:500\">${f(m.hh)}<\/td>\n      <td>${spark(m.dsTrend,BCOLS[i%BCOLS.length])}<\/td>\n      <td style=\"text-align:right\"><span class=\"chev tmchev\" onclick=\"event.stopPropagation();toggleTeam(${i},this)\" role=\"button\" tabindex=\"0\" aria-label=\"Chi tiết\">${CV}<\/span><\/td>\n    <\/tr>\n    <tr class=\"tm-det\" id=\"tmdet${i}\"><td colspan=\"9\" style=\"background:var(--color-background-secondary);padding:10px 12px\">\n      <div class=\"tm-det-cards\">\n        <div class=\"tm-card\"><div class=\"tm-card-l\">Doanh số thực<\/div><div class=\"tm-card-v\">${f(m.ds)}<\/div><\/div>\n        <div class=\"tm-card\"><div class=\"tm-card-l\">KPI cá nhân<\/div><div class=\"tm-card-v\">${f(m.kpi)}<\/div><\/div>\n        <div class=\"tm-card\"><div class=\"tm-card-l\">% Đạt KPI<\/div><div class=\"tm-card-v\" style=\"color:${kpiC}\">${kpiPct}%<\/div><div class=\"pg\" style=\"margin-top:4px\"><div class=\"pf\" style=\"width:${Math.min(100,kpiPct)}%;background:${kpiC}\"><\/div><\/div><\/div>\n      <\/div>\n      <div style=\"font-size:11px;color:var(--color-text-secondary);font-weight:500;margin-bottom:5px\">Các dự án đóng góp doanh thu<\/div>\n      <div style=\"overflow:hidden;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-primary)\">\n        <table class=\"tbl\" style=\"margin:0\"><thead><tr><th>Dự án<\/th><th style=\"width:20%\">Mã căn<\/th><th style=\"width:22%\">Doanh số<\/th><th style=\"width:12%\">%HH<\/th><th style=\"width:22%\">HH<\/th><\/tr><\/thead><tbody>${projRows}<\/tbody><\/table>\n      <\/div>\n    <\/td><\/tr>`;\n  }).join('');\n  const teamTbl=`\n  <div style=\"overflow-x:auto;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg)\">\n    <table class=\"tbl\" style=\"min-width:680px\">\n      <thead><tr><th style=\"width:18%\">Họ tên<\/th><th style=\"width:9%\">Mã<\/th><th style=\"width:9%\">Vai trò<\/th><th style=\"width:12%\">Doanh số<\/th><th style=\"width:12%\">%DS team<\/th><th style=\"width:9%\">%HH TB<\/th><th style=\"width:13%\">HH kỳ này<\/th><th style=\"width:13%\">DS theo tháng<\/th><th style=\"width:5%\"><\/th><\/tr><\/thead>\n      <tbody>${rows}<tr style=\"background:var(--color-background-secondary);font-weight:500\"><td colspan=\"3\">Tổng cộng<\/td><td>${fM(totalDS)}<\/td><td>100%<\/td><td>—<\/td><td class=\"pos\">${f(totalHH)}<\/td><td colspan=\"2\"><\/td><\/tr><\/tbody>\n    <\/table>\n  <\/div>`;\n  document.getElementById(cid).innerHTML=`\n  <div class=\"card\"><div class=\"shd\">Cơ chế HH ${d.role} — 3 mức · DS team ${fM(d.dsTeam)} · KPI ${fM(d.kpiDs)}<\/div>${tierCards}<\/div>\n  <div class=\"team-stat\">\n    <div class=\"kc\"><div class=\"kl\">DS team / KPI<\/div><div class=\"kv\">${fM(d.dsTeam)}<\/div><div class=\"pg\"><div class=\"pf\" style=\"width:${Math.min(100,Math.round(d.dsTeam/d.kpiDs*100))}%;background:${Math.round(d.dsTeam/d.kpiDs*100)>=100?'#185FA5':'#378ADD'}\"><\/div><\/div><\/div>\n    <div class=\"kc\"><div class=\"kl\">HH ${activeMuc(d)} hiện tại<\/div><div class=\"kv pos\">${f(curHH)}<\/div><div class=\"ks\">${cur?cur.r+'%':'—'} × ${(d.dsTeam*0.015/1e9).toFixed(2)} tỷ phí DV<\/div><\/div>\n    ${next?`<div class=\"kc\"><div class=\"kl\">Nếu đạt ${next.m}<\/div><div class=\"kv\" style=\"color:var(--color-text-info)\">${f(nextHH)}<\/div><div class=\"ks\" style=\"color:var(--color-text-danger)\">+${f(diffHH)} · cần ${fM(next.need-d.dsTeam)}<\/div><\/div>`:`<div class=\"kc\"><div class=\"kl\">Mức tối đa M2<\/div><div class=\"kv pos\">✓<\/div><\/div>`}\n    <div class=\"kc\"><div class=\"kl\">Nhân sự team<\/div><div class=\"kv\">${tm.reduce((s,x)=>s+x.nguoi,0)} NV<\/div><div class=\"ks\">${tm.length} phòng/nhóm<\/div><\/div>\n  <\/div>\n  <div class=\"card\">\n    <div class=\"chart-lead\">\n      <div class=\"shd\" style=\"margin-bottom:0\">Doanh số (cột) & Hoa hồng (đường) từng thành viên<\/div>\n      <div class=\"chart-leg\">\n        <span><span style=\"width:10px;height:10px;border-radius:2px;background:#378ADD;display:inline-block;vertical-align:middle;margin-right:3px\"><\/span>Doanh số (trục trái)<\/span>\n        <span><span style=\"width:14px;height:3px;background:#0C447C;display:inline-block;vertical-align:middle;margin-right:3px\"><\/span>Hoa hồng (trục phải)<\/span>\n      <\/div>\n    <\/div>\n    <div style=\"position:relative;height:200px\"><canvas id=\"ct\" role=\"img\" aria-label=\"DS và HH từng thành viên\">DS và HH team.<\/canvas><\/div>\n  <\/div>\n  <div class=\"card\"><div class=\"shd\">Bảng DS & HH team tháng ${mon} — nhấn từng dòng để xem dự án<\/div>${teamTbl}<\/div>`;\n  setTimeout(()=>{const cv=document.getElementById('ct');if(!cv)return;charts.ct=new Chart(cv,{type:'bar',data:{labels:tm.map(m=>m.name.split(' ').slice(-1)[0]),datasets:[{label:'Doanh số',data:tm.map(m=>+(m.ds/1e6).toFixed(1)),backgroundColor:'#378ADD',borderRadius:4,yAxisID:'y'},{type:'line',label:'Hoa hồng',data:tm.map(m=>+(m.hh/1e6).toFixed(1)),borderColor:'#0C447C',borderWidth:2,pointRadius:3,pointBackgroundColor:'#0C447C',fill:false,yAxisID:'y2'}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.parsed.y+'M'}}},scales:{x:{ticks:{color:txS,font:{size:10},autoSkip:false},grid:{display:false},border:{display:false}},y:{position:'left',title:{display:true,text:'Doanh số (M)',color:txS,font:{size:10}},ticks:{color:txS,font:{size:10},callback:v=>v+'M'},grid:{color:gC},border:{display:false}},y2:{position:'right',title:{display:true,text:'Hoa hồng (M)',color:txS,font:{size:10}},ticks:{color:txS,font:{size:10},callback:v=>v+'M'},grid:{display:false},border:{display:false}}}}});},60);\n}\n\nfunction rAnalytics(d,c,mon,cid){\n  const lbls=d.trend.map(t=>t.m);\n  const lbD=d.trend.map(t=>t.m==='T01'?+(c.lb/1e6).toFixed(1):t.lb);\n  const hhD=d.trend.map(t=>t.m==='T01'?+(c.hhN/1e6).toFixed(1):t.hh);\n  const thD=d.trend.map(t=>t.m==='T01'?+((d.thuongTet+d.luongT13+(d.thuongDA||0)+(d.kqkd||0))/1e6).toFixed(1):t.th);\n  const dsD=d.kpiDs?d.trend.map(t=>t.m==='T01'?+(d.dsTeam/1e6).toFixed(1):t.ds):null;\n  const tiersPos=d.hhTiers?d.hhTiers.filter(t=>t.need>0):[];\n  const attHtml=d.role==='CTV'?'<div class=\"nf\">CTV không áp dụng chấm công.<\/div>':`\n    <div class=\"att-wrap\"><table class=\"att-tbl\"><thead><tr><th class=\"thi\">Nhân viên<\/th>${DOW.map((w,i)=>`<th><span style=\"font-size:9px;display:block;color:var(--color-text-secondary)\">${w}<\/span><span style=\"font-size:10px;font-weight:500\">${i+1}<\/span><\/th>`).join('')}<th class=\"ths\">∑<\/th><\/tr><\/thead>\n    <tbody><tr><td class=\"tdi\">${d.name}<\/td>${d.att.map((v,i)=>`<td>${attCell(v,i)}<\/td>`).join('')}<td class=\"tds\">${d.ngayCong}<\/td><\/tr><\/tbody><\/table><\/div>\n    ${attLegend()}\n    <div class=\"att-sum\"><span>Ngày công: <strong>${d.ngayCong}/${d.chuanT}<\/strong><\/span><span>Tỷ lệ: <strong class=\"up\">${pct(d.ngayCong,d.chuanT)}<\/strong><\/span><span>Phép còn T02: <strong>${d.phepConT02}/${d.phepNamNay}<\/strong><\/span><span>Nghỉ lễ: <strong>${d.ngayLe}<\/strong><\/span><\/div>`;\n  const kpiLegend=tiersPos.length?tiersPos.map((t,i)=>`<span><span style=\"width:14px;height:0;border-top:2px dashed ${['#378ADD','#0C447C','#85B7EB'][i%3]};display:inline-block;vertical-align:middle;margin-right:3px\"><\/span>KPI ${t.m} (${fM(t.need)})<\/span>`).join(''):'';\n  document.getElementById(cid).innerHTML=`\n  <div class=\"chart2\">\n    <div class=\"card\">\n      <div class=\"shd\">Thu nhập 7 tháng (triệu đ) — bar chồng<\/div>\n      <div style=\"display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px;font-size:10px\">\n        <span style=\"display:flex;align-items:center;gap:3px\"><span style=\"width:9px;height:9px;border-radius:2px;background:#888780;display:inline-block\"><\/span>Lương CB<\/span>\n        <span style=\"display:flex;align-items:center;gap:3px\"><span style=\"width:9px;height:9px;border-radius:2px;background:#378ADD;display:inline-block\"><\/span>HH DA<\/span>\n        <span style=\"display:flex;align-items:center;gap:3px\"><span style=\"width:9px;height:9px;border-radius:2px;background:#0C447C;display:inline-block\"><\/span>Thưởng<\/span>\n      <\/div>\n      <div style=\"position:relative;height:200px\"><canvas id=\"c1\" role=\"img\" aria-label=\"Thu nhập chồng 7 tháng\">Thu nhập.<\/canvas><\/div>\n    <\/div>\n    <div class=\"card\">\n      ${d.kpiDs?`\n      <div class=\"shd\">Doanh số theo dự án vs KPI<\/div>\n      <div class=\"chart-leg\" style=\"margin-bottom:6px;font-size:10px\">\n        ${(d.daDist||[]).map((x,i)=>`<span><span style=\"width:9px;height:9px;border-radius:2px;background:${BCOLS[i%BCOLS.length]};display:inline-block;vertical-align:middle;margin-right:3px\"><\/span>${x.da}<\/span>`).join('')}\n        ${kpiLegend}\n      <\/div>\n      <div style=\"position:relative;height:200px\"><canvas id=\"c2\" role=\"img\" aria-label=\"DS theo DA vs KPI\">DS theo DA và mức KPI.<\/canvas><\/div>`:`\n      <div class=\"shd\">Cơ cấu thu nhập tháng ${mon}<\/div>\n      <div style=\"position:relative;height:200px\"><canvas id=\"c2\" role=\"img\" aria-label=\"Cơ cấu thu nhập\">Cơ cấu.<\/canvas><\/div>`}\n    <\/div>\n  <\/div>\n  <div id=\"hhsec\"><\/div>\n  <div class=\"card\"><div class=\"shd\">Chấm công ${mon}<\/div>${attHtml}<\/div>`;\n  renderHHSection();\n  setTimeout(()=>{\n    const c1=document.getElementById('c1'),c2=document.getElementById('c2');\n    if(c1)charts.c1=new Chart(c1,{type:'bar',data:{labels:lbls,datasets:[{label:'Lương CB',data:lbD,backgroundColor:'#888780',stack:'a'},{label:'HH DA',data:hhD,backgroundColor:'#378ADD',stack:'a'},{label:'Thưởng',data:thD,backgroundColor:'#0C447C',stack:'a'}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.parsed.y+'M'}}},scales:{x:{stacked:true,ticks:{color:txS,font:{size:10},autoSkip:false},grid:{display:false},border:{display:false}},y:{stacked:true,ticks:{color:txS,font:{size:10},callback:v=>v+'M'},grid:{color:gC},border:{display:false}}}}});\n    if(c2&&d.kpiDs&&dsD&&d.daDist&&d.daDist.length){\n      const daDS=d.daDist.map((x,i)=>({label:x.da,data:lbls.map(m=>{if(m==='T01')return +x.ds.toFixed(1);const total=(d.trend.find(tt=>tt.m===m)||{}).ds||0;return +((x.pct/100)*total).toFixed(1);}),backgroundColor:BCOLS[i%BCOLS.length],stack:'b'}));\n      const kpiLines=tiersPos.map((t,i)=>({type:'line',label:'KPI '+t.m,data:lbls.map(()=>+(t.need/1e6).toFixed(1)),borderColor:['#378ADD','#0C447C','#85B7EB'][i%3],borderWidth:1.5,borderDash:[5,3],pointRadius:0,fill:false,stack:'kpi'+i}));\n      charts.c2=new Chart(c2,{type:'bar',data:{labels:lbls,datasets:[...daDS,...kpiLines]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+ctx.parsed.y+'M'}}},scales:{x:{stacked:true,ticks:{color:txS,font:{size:10},autoSkip:false},grid:{display:false},border:{display:false}},y:{stacked:true,ticks:{color:txS,font:{size:10},callback:v=>v+'M'},grid:{color:gC},border:{display:false}}}}});\n    } else if(c2){\n      const pl=[],pd=[],pc=[];\n      if(c.lb>0){pl.push('Lương CB');pd.push(+(c.lb/1e6).toFixed(1));pc.push('#888780');}\n      if(c.hhN>0){pl.push('HH DA');pd.push(+(c.hhN/1e6).toFixed(1));pc.push('#378ADD');}\n      if(d.thuongTet>0){pl.push('Thưởng Tết');pd.push(+(d.thuongTet/1e6).toFixed(1));pc.push('#185FA5');}\n      if(d.luongT13>0){pl.push('Lương T13');pd.push(+(d.luongT13/1e6).toFixed(1));pc.push('#85B7EB');}\n      if(c.kq>0){pl.push('KQKD');pd.push(+(c.kq/1e6).toFixed(1));pc.push('#0C447C');}\n      if(pd.length)charts.c2=new Chart(c2,{type:'doughnut',data:{labels:pl,datasets:[{data:pd,backgroundColor:pc,borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:true,position:'right',labels:{color:txS,font:{size:10},boxWidth:10,padding:6}}},cutout:'58%'}});\n    }\n  },60);\n}\n\ndocument.getElementById('nv').addEventListener('keydown',e=>{if(e.key==='Enter')window.go();});\n['dStart','dEnd'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('change',()=>{if(document.getElementById('content').style.display!=='none')window.go();});});\ndocument.addEventListener('click',function(e){\n  const dd=document.getElementById('dadd');\n  if(dd&&dd.classList.contains('open')){const btn=dd.previousElementSibling;if(!dd.contains(e.target)&&btn&&!btn.contains(e.target))dd.classList.remove('open');}\n});\nwindow.go();\n})();\n<\/script>\n<\/body>\n<\/html>\n"};
